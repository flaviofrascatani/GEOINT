#tip{position:fixed;z-index:300;pointer-events:none;opacity:0;transition:opacity .2s;padding:10px 16px;background:var(--surface);border:1px solid var(--border-h);border-radius:4px;backdrop-filter:blur(14px)}

.pnl-b{padding:12px 14px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}

.sec{margin-bottom:10px}.sec-t{font-family:var(--cond);font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sec p{font-size:11px;color:var(--text);line-height:1.6;margin-bottom:6px}

.eth-pct{font-size:9px;color:var(--text-dim);min-width:30px;text-align:right}
.eth-profile{margin:4px 0 8px;padding:8px;border-left:2px solid var(--accent2);background:rgba(48,88,82,.06);border-radius:0 4px 4px 0}

.terrain-bar{display:flex;height:14px;border-radius:3px;overflow:hidden;margin-bottom:6px}

.tb-p{background:var(--green)}.tb-h{background:var(--gold)}.tb-m{background:var(--accent2)}

const pickScene=new THREE.Scene();
const pickGroup=new THREE.Group();
const pickGlobe=new THREE.Mesh(globeGeo,pickMat);
pickGroup.add(pickGlobe);
pickScene.add(pickGroup);

const pickBuf=new Uint8Array(4);

function gpuPick(mx,my){
  // Read pixel from last pick render
  ren.readRenderTargetPixels(pickRT,
    Math.floor(mx*pickRT.width/innerWidth),
    pickRT.height-1-Math.floor(my*pickRT.height/innerHeight),
    1,1,pickBuf);
  if(pickBuf[0]===0&&pickBuf[1]===0&&pickBuf[2]===0)return null;
  const hex='#'+((pickBuf[0]<<16)|(pickBuf[1]<<8)|pickBuf[2]).toString(16).padStart(6,'0');
  return color2id[hex]||null;
}

// ============== INTERACTION ==============
let drag=false,pm={x:0,y:0},cpm={x:0,y:0},rvx=0,rvy=0,autoR=true,tZoom=4.8;
let selectedId=null,hoveredId=null,activeTab='overview';
let events=[],pendingLL=null;

function llv(lat,lng,r){const p=(90-lat)*Math.PI/180,t=(lng+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))}
function fN(n){if(!n)return'0';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return''+n}

canvas.addEventListener('mousedown',e=>{drag=true;pm=cpm={x:e.clientX,y:e.clientY};autoR=false});
canvas.addEventListener('mousemove',e=>{
  if(drag){const dx=e.clientX-pm.x,dy=e.clientY-pm.y;rvx=dx*.003;rvy=dy*.003;
    globeGroup.rotation.y+=dx*.005;
    globeGroup.rotation.x=Math.max(-Math.PI/2,Math.min(Math.PI/2,globeGroup.rotation.x+dy*.005));
    pm={x:e.clientX,y:e.clientY};return}// Skip picking while dragging
  const id=gpuPick(e.clientX,e.clientY);
  const tt=document.getElementById('tip');
  const d=id?DB[id]:null;
  const nm=d?d.n:(id?CN[id]||id:null);
  document.getElementById('coords').textContent=id?nm:'—';
  if(id&&nm){
    tt.classList.add('on');tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-8)+'px';
    document.getElementById('tt-n').textContent=(d&&d.f?d.f+' ':'')+nm;
    document.getElementById('tt-s').textContent=d?`POP ${fN(d.pop)} · GDP $${d.gdp}B`:'';
    canvas.style.cursor='pointer';
    if(hoveredId!==id){
      if(hoveredId&&hoveredId!==selectedId)redrawCountry(hoveredId,'#1e2e28');
      hoveredId=id;if(hoveredId!==selectedId)redrawCountry(hoveredId,'#2a4a3a');
    }
  }else{
    tt.classList.remove('on');canvas.style.cursor='grab';
    if(hoveredId&&hoveredId!==selectedId){redrawCountry(hoveredId,'#1e2e28');hoveredId=null}
  }
});
canvas.addEventListener('mouseup',()=>drag=false);
canvas.addEventListener('wheel',e=>{tZoom=Math.max(2,Math.min(10,tZoom+e.deltaY*.005));e.preventDefault()},{passive:false});
canvas.addEventListener('click',e=>{
  if(Math.abs(e.clientX-cpm.x)>5||Math.abs(e.clientY-cpm.y)>5)return;
  const id=gpuPick(e.clientX,e.clientY);
  selectCountry(id);
});
canvas.addEventListener('contextmenu',e=>{e.preventDefault()});

// ============== COUNTRY SELECT ==============
function redrawCountry(id,fill){
  if(!countryPolys[id])return;
  countryPolys[id].forEach(poly=>poly.forEach((ring,ri)=>{if(ri===0)drawPoly(ctx,ring,fill,'#3a5a4a',.5)}));
  visTex.needsUpdate=true;
}

function clearOv(){while(overlayGrp.children.length)overlayGrp.remove(overlayGrp.children[0])}

function selectCountry(id){
  clearOv();
  if(selectedId)redrawCountry(selectedId,'#1e2e28');
  selectedId=id;
  if(!selectedId){closeDetail();return}
  redrawCountry(selectedId,'#305852');
  showDetail(selectedId);
  // Show extraction/base markers
  const d=DB[id];
  if(d&&d.ext)d.ext.forEach(e=>addOv(e.lat,e.lng,0xb89a4a));
  if(d&&d.bas)d.bas.forEach(b=>addOv(b.lat,b.lng,b.f?0xc4a095:0xc27066));
}

function addOv(lat,lng,col){
  const p=llv(lat,lng,R*1.02),g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.012,8,8),new THREE.MeshBasicMaterial({color:col})));
  g.position.copy(p);g.lookAt(0,0,0);g.rotateX(Math.PI);overlayGrp.add(g);
}

window.focusLL=function(lat,lng){
  const ty=-lng*Math.PI/180,tx=lat*Math.PI/180;
  const sx=globeGroup.rotation.x,sy=globeGroup.rotation.y;let t=0;autoR=false;
  (function step(){t+=1/60;if(t>1.2)return;const p=1-Math.pow(1-t/1.2,3);
    globeGroup.rotation.x=sx+(tx-sx)*p;globeGroup.rotation.y=sy+(ty-sy)*p;
    requestAnimationFrame(step)})()};

// ============== DETAIL PANEL ==============
function showDetail(id){document.getElementById('detail').classList.add('open');document.getElementById('btn-detail').classList.add('on');activeTab='overview';setTabs();renderTab(id)}
window.closeDetail=function(){document.getElementById('detail').classList.remove('open');document.getElementById('btn-detail').classList.remove('on');clearOv();if(selectedId){redrawCountry(selectedId,'#1e2e28');selectedId=null}}
document.querySelectorAll('#dtabs .tab').forEach(t=>t.addEventListener('click',()=>{activeTab=t.dataset.tab;setTabs();if(selectedId)renderTab(selectedId)}));
function setTabs(){document.querySelectorAll('#dtabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===activeTab))}

function renderTab(id){
  const d=DB[id],b=document.getElementById('det-body');
  if(!d||!d.cul){b.innerHTML=`<div style="padding:20px"><div style="font-size:16px;color:var(--bright);font-family:var(--sans);margin-bottom:8px">${d?((d.f||'')+' '+d.n):(CN[id]||id)}</div><div class="stats"><div class="stat"><div class="sl">Population</div><div class="sv">${d?fN(d.pop):'—'}</div></div><div class="stat"><div class="sl">GDP (B USD)</div><div class="sv">${d?'$'+d.gdp:'—'}</div></div></div><div style="font-size:11px;color:var(--text-dim)">Extended intel not yet available.</div></div>`;return}
  if(activeTab==='overview')b.innerHTML=rOverview(d);
  else if(activeTab==='geography')b.innerHTML=rGeo(d);
  else if(activeTab==='economy')b.innerHTML=rEcon(d);
  else b.innerHTML=rStrat(d);
}

function rOverview(d){let h=`<div class="c-head"><div class="c-flag">${d.f||''}</div><div><div class="c-name">${d.n}</div><div class="c-cap">Capital: ${d.c||'—'}</div></div></div>`;
h+=`<div class="stats"><div class="stat"><div class="sl">Population</div><div class="sv">${fN(d.pop)}</div></div><div class="stat"><div class="sl">Area km²</div><div class="sv">${fN(d.a)}</div></div><div class="stat"><div class="sl">GDP (B USD)</div><div class="sv">$${d.gdp}</div></div><div class="stat"><div class="sl">GDP/Capita</div><div class="sv">$${d.gdpPC?fN(d.gdpPC):'—'}</div></div></div>`;
if(d.eth){h+='<div class="sec"><div class="sec-t">Ethnic Composition</div>';d.eth.forEach(e=>{h+=`<div class="eth-row"><span class="eth-name">${e.n}</span><div class="eth-track"><div class="eth-fill" style="width:${e.p}%"></div></div><span class="eth-pct">${e.p}%</span></div>`;if(d.ethP&&d.ethP[e.n])h+=`<div class="eth-profile"><p>${d.ethP[e.n]}</p></div>`});h+='</div>'}
if(d.cul)h+=`<div class="sec"><div class="sec-t">Cultural Profile</div><p>${d.cul}</p></div>`;return h}

function rGeo(d){let h='';
if(d.ter){h+=`<div class="sec"><div class="sec-t">Terrain</div><div class="terrain-bar"><div class="tb-p" style="width:${d.ter.p}%">${d.ter.p}%</div><div class="tb-h" style="width:${d.ter.h}%">${d.ter.h}%</div><div class="tb-m" style="width:${d.ter.m}%">${d.ter.m}%</div></div><div class="terrain-legend"><span class="tl-p">Plains</span><span class="tl-h">Hills</span><span class="tl-m">Mountains</span></div></div>`}
if(d.pk&&d.pk.length){const mx=Math.max(...d.pk.map(p=>p.h)),cw=340,ch=80;h+=`<div class="sec"><div class="sec-t">Elevation Profile</div><div class="topo-chart"><svg width="${cw}" height="${ch+35}" viewBox="0 0 ${cw} ${ch+35}">`;const gap=cw/(d.pk.length+1);d.pk.forEach((p,i)=>{const x=gap*(i+1),bh=Math.max(10,(p.h/mx)*ch);h+=`<rect x="${x-14}" y="${ch-bh+8}" width="28" height="${bh}" fill="#6b4a2a" rx="2"/><text x="${x}" y="${ch-bh+2}" text-anchor="middle" fill="#d5c4a1" font-size="10" font-family="IBM Plex Mono" font-weight="600">${p.h}m</text><text x="${x}" y="${ch+22}" text-anchor="middle" fill="#9aaa97" font-size="8" font-family="IBM Plex Mono">${p.n}</text>`});h+='</svg></div></div>'}
if(d.mtn)h+=`<div class="sec"><div class="sec-t">Mountains</div><ul>${d.mtn.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
if(d.pln)h+=`<div class="sec"><div class="sec-t">Plains</div><ul>${d.pln.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
if(d.riv)h+=`<div class="sec"><div class="sec-t">Rivers</div><ul>${d.riv.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
if(d.lak)h+=`<div class="sec"><div class="sec-t">Lakes</div><ul>${d.lak.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
return h||'<p style="color:var(--text-dim)">No geography data.</p>'}

function rEcon(d){let h=`<div class="stats"><div class="stat"><div class="sl">GDP (B)</div><div class="sv">$${d.gdp}</div></div><div class="stat"><div class="sl">GDP/Cap</div><div class="sv">$${d.gdpPC?fN(d.gdpPC):'—'}</div></div></div>`;
if(d.ex&&d.ex.length){h+='<div class="sec"><div class="sec-t">Top Exports</div>';d.ex.forEach(e=>{const o=typeof e==='string'?{n:e}:e;h+=`<div class="trade-row"><span class="trade-name">${o.n}</span>${o.p?`<div class="trade-bar"><div class="trade-fill ex" style="width:${Math.min(o.p*1.5,100)}%"></div></div><span class="trade-pct">${o.p}%</span>`:''}</div>`});h+='</div>'}
if(d.im&&d.im.length){h+='<div class="sec"><div class="sec-t">Top Imports</div>';d.im.forEach(e=>{const o=typeof e==='string'?{n:e}:e;h+=`<div class="trade-row"><span class="trade-name">${o.n}</span>${o.p?`<div class="trade-bar"><div class="trade-fill im" style="width:${Math.min(o.p*1.5,100)}%"></div></div><span class="trade-pct">${o.p}%</span>`:''}</div>`});h+='</div>'}
if(d.ext&&d.ext.length){h+='<div class="sec"><div class="sec-t">Extraction Sites</div>';d.ext.forEach(e=>{h+=`<div class="marker-item" onclick="focusLL(${e.lat},${e.lng})"><div class="mi-name"><span class="mi-dot ext"></span>${e.n}</div><div class="mi-info">${e.r}</div></div>`});h+='</div>'}
return h||'<p style="color:var(--text-dim)">No economic data.</p>'}

function rStrat(d){if(!d.bas||!d.bas.length)return'<p style="color:var(--text-dim)">No strategic data.</p>';let h='';
const dom=d.bas.filter(b=>!b.f),fore=d.bas.filter(b=>b.f);
if(dom.length){h+='<div class="sec"><div class="sec-t">Domestic</div>';dom.forEach(b=>{h+=`<div class="marker-item" onclick="focusLL(${b.lat},${b.lng})"><div class="mi-name"><span class="mi-dot mil"></span>${b.n}</div><div class="mi-info">${b.t}</div></div>`});h+='</div>'}
if(fore.length){h+='<div class="sec"><div class="sec-t">Foreign Presence</div>';fore.forEach(b=>{h+=`<div class="marker-item" onclick="focusLL(${b.lat},${b.lng})"><div class="mi-name"><span class="mi-dot for"></span>${b.n}</div><div class="mi-info">${b.t}</div></div>`});h+='</div>'}
return h}

// Sidebar toggle
document.getElementById('btn-side').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('off'));
document.getElementById('btn-detail').addEventListener('click',()=>closeDetail());

// Events
document.getElementById('btn-ev').addEventListener('click',()=>{
  const ti=document.getElementById('ev-t').value.trim();if(!ti)return;
  const ty=document.getElementById('ev-type').value;
  events.push({title:ti,type:ty});
  document.getElementById('ev-count').textContent=events.length;
  document.getElementById('ev-t').value='';
});

// Clock
setInterval(()=>{const n=new Date;document.getElementById('clock').textContent=`UTC ${n.getUTCHours().toString().padStart(2,'0')}:${n.getUTCMinutes().toString().padStart(2,'0')}:${n.getUTCSeconds().toString().padStart(2,'0')}`},1000);

// ============== ANIMATION LOOP ==============
lf.style.width='100%';setTimeout(()=>document.getElementById('loader').classList.add('done'),600);

function animate(){
  requestAnimationFrame(animate);
  if(autoR)globeGroup.rotation.y+=.0005;
  if(!drag){rvx*=.94;rvy*=.94;globeGroup.rotation.y+=rvx;globeGroup.rotation.x+=rvy}
  cam.position.z+=(tZoom-cam.position.z)*.06;

  // Sync pick scene rotation with main globe
  pickGroup.rotation.copy(globeGroup.rotation);

  // GPU PICK RENDER — render pick-colored globe to offscreen target
  ren.setRenderTarget(pickRT);
  ren.setClearColor(0x000000,1);
  ren.clear();
  ren.render(pickScene,cam);

  // MAIN RENDER
  ren.setRenderTarget(null);
  ren.setClearColor(0x131a17,1);
  ren.clear();
  ren.render(scene,cam);

  // Pulse markers
  const t=Date.now()*.003;
  overlayGrp.children.forEach(g=>{const s=1+Math.sin(t)*.3;g.scale.set(s,s,s)});
}
animate();

window.addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  ren.setSize(innerWidth,innerHeight);
  pickRT.setSize(innerWidth,innerHeight);
});
})();
</script>
</body></html>
