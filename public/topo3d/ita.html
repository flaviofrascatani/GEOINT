<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEOINT · Italy 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f0c;--bg-deep:#050805;--border:rgba(190,207,184,.12);
  --border-h:rgba(190,207,184,.24);--accent:#8aad84;--accent-bright:#c4e0bd;
  --accent-dim:#5a7d54;--text:#9aaa97;--text-dim:#5a6d5e;
  --white:#d5d8d2;--bright:#e8ebe5;--warn:#e8b96b;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
#app{width:100%;height:100%;position:relative;background:radial-gradient(ellipse at 50% 32%,#10180f 0%,#0a0f0c 55%,#050805 100%)}
#app canvas{display:block;cursor:grab}
#app canvas:active{cursor:grabbing}
#fx{position:absolute;inset:0;z-index:5;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%),
    repeating-linear-gradient(0deg,rgba(120,180,120,.03) 0px,rgba(120,180,120,.03) 1px,transparent 2px,transparent 3px);
  mix-blend-mode:soft-light}
#hud{position:absolute;top:16px;left:18px;z-index:10;pointer-events:none;
  border-left:2px solid var(--accent);padding:11px 16px;
  background:linear-gradient(90deg,rgba(5,9,6,.94),rgba(5,9,6,.42));border-radius:0 4px 4px 0;
  backdrop-filter:blur(2px)}
.ht{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:2.8px;color:var(--accent-bright)}
.hs{font-family:var(--mono);font-size:8.5px;letter-spacing:1.7px;color:var(--accent-dim);margin-top:3px}
.hb{font-family:var(--mono);font-size:9px;color:var(--text);margin-top:11px;line-height:1.9;letter-spacing:.4px}
.hb b{color:var(--accent-bright);font-weight:500}
.hb .sep{color:#1a2a20;letter-spacing:0}
#coords{font-family:var(--mono);font-size:9px;color:var(--text);line-height:1.9;letter-spacing:.4px}
#coords b{color:var(--accent-bright);font-weight:500}
#coords .sep{color:#1a2a20}
#lw{position:absolute;right:18px;top:50%;transform:translateY(-50%);z-index:10;pointer-events:none;display:flex;align-items:stretch;gap:9px}
#ll{display:flex;flex-direction:column;justify-content:space-between;height:210px;text-align:right}
#ll span{font-family:var(--mono);font-size:8.5px;color:var(--text-dim);letter-spacing:.6px}
#lb{border:1px solid var(--border-h);border-radius:2px;box-shadow:0 0 14px rgba(0,0,0,.4)}
#lc{font-family:var(--mono);font-size:7.5px;letter-spacing:1.4px;color:var(--accent-dim);
  writing-mode:vertical-rl;text-orientation:mixed;align-self:center}
#ctl{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:7px;
  background:rgba(5,9,6,.82);padding:7px 9px;border:1px solid var(--border);border-radius:7px;
  backdrop-filter:blur(4px);max-width:96vw;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--text-dim);
  background:transparent;border:1px solid var(--border);border-radius:4px;padding:6px 10px;cursor:pointer;
  transition:all .15s;user-select:none}
.btn:hover{color:var(--accent-bright);border-color:var(--border-h)}
.btn.on{color:var(--bg-deep);background:var(--accent);border-color:var(--accent);font-weight:600}
.dot{position:absolute;top:0;left:0;width:6px;height:6px;border-radius:50%;
  transform-origin:center;pointer-events:none;will-change:transform;margin:-3px 0 0 -3px}
.dot-peak{background:var(--accent-bright);box-shadow:0 0 7px rgba(196,224,189,.9)}
.dot-city{background:var(--warn);width:5px;height:5px;margin:-2.5px 0 0 -2.5px;box-shadow:0 0 6px rgba(232,185,107,.8)}
.lbl{position:absolute;top:0;left:0;pointer-events:none;white-space:nowrap;will-change:transform;
  font-family:var(--mono);display:flex;align-items:baseline;gap:5px;
  text-shadow:0 0 4px #050805,0 1px 2px #050805,0 0 8px #050805}
.lbl .nm{font-size:9px;letter-spacing:1px;font-weight:500}
.lbl .h{font-size:7.5px;letter-spacing:.5px}
.lbl-peak .nm{color:var(--bright)} .lbl-peak .h{color:var(--accent)}
.lbl-city .nm{color:#f0d9a8} .lbl-city .h{color:#a8895a}
.ev-pin{position:absolute;top:0;left:0;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;cursor:pointer;
  pointer-events:auto;will-change:transform;display:none}
.ev-pin::before{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--warn);
  box-shadow:0 0 8px var(--warn)}
.ev-pin::after{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--warn);
  animation:pp 1.8s ease-out infinite}
@keyframes pp{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.ev-card{position:absolute;top:0;left:0;z-index:12;display:none;width:240px;pointer-events:auto;
  background:rgba(6,11,8,.96);border:1px solid var(--border-h);border-radius:6px;overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,.6);will-change:transform}
.ev-img{width:100%;height:108px;object-fit:cover;display:block}
.ev-t{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--bright);padding:9px 11px 3px;letter-spacing:.3px}
.ev-meta{font-family:var(--mono);font-size:8px;color:var(--text-dim);padding:0 11px 6px;letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.ev-sev{width:7px;height:7px;border-radius:50%;display:inline-block}
.ev-sev1{background:#6bbf6b}.ev-sev2{background:#a9c46b}.ev-sev3{background:#e8c96b}.ev-sev4{background:#e89a4b}.ev-sev5{background:#e85b4b}
.ev-d{font-family:var(--sans);font-size:10px;color:var(--text);padding:0 11px 11px;line-height:1.55}
#att{position:absolute;bottom:8px;right:12px;z-index:10;font-family:var(--mono);font-size:7.5px;
  color:#2a3a30;letter-spacing:1px;pointer-events:none}
body.fs #ctl{bottom:24px}

/* ===== COMPACT MODE: when embedded in a short iframe (index panel) ===== */
body.compact #hud{top:8px;left:9px;padding:6px 9px}
body.compact .ht{font-size:9.5px;letter-spacing:1.8px}
body.compact .hs{font-size:6.5px;margin-top:2px}
body.compact #coords{font-size:7.5px;line-height:1.55;margin-top:6px}
body.compact #lw{right:8px;gap:5px}
body.compact #ll{height:120px}
body.compact #ll span{font-size:6.5px}
body.compact #lb{height:120px}
body.compact #lc{font-size:6px;letter-spacing:1px}
body.compact #ctl{bottom:7px;gap:4px;padding:4px 6px}
body.compact .btn{font-size:7.5px;padding:3px 6px;letter-spacing:.5px}
body.compact #att{font-size:6px;bottom:5px;right:8px}
body.compact .lbl .nm{font-size:8px}
body.compact .lbl .h{font-size:6.5px}
body.tiny #lw{display:none}
body.tiny #att{display:none}
body.tiny .hs{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="fx"></div>
  <div id="hud">
    <div class="ht">ITALY</div>
    <div class="hs">TERRAIN ELEVATION MODEL &middot; TOPOGRAPHIC</div>
    <div class="hb" id="coords">LAT &nbsp;<b>&mdash;</b><br>LON &nbsp;<b>&mdash;</b><br>ELEV &nbsp;<b>&mdash;</b><br><span class="sep">&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;&mdash;</span><br>MAX &nbsp;<b>4810 m</b><br>GRID &nbsp;320 &times; 256</div>
  </div>
  <div id="lw">
    <div id="ll"><span>4810m</span><span></span><span></span><span></span><span>0m</span></div>
    <canvas id="lb" width="11" height="210"></canvas>
    <div id="lc">ELEVATION</div>
  </div>
  <div id="ctl">
    <button class="btn on" id="bc">CONTOURS</button>
    <button class="btn on" id="bw">GRID</button>
    <button class="btn on" id="bb">BORDER</button>
    <button class="btn on" id="bp">PEAKS</button>
    <button class="btn on" id="bcty">CITIES</button>
    <button class="btn on" id="be">EVENTS</button>
    <button class="btn" id="br">RESET VIEW</button>
    <button class="btn" id="ftog"><span id="flbl">Fullscreen</span></button>
  </div>
  <div id="att">GEOINT // SYNTHETIC ELEVATION RENDER</div>
</div>

AAAAA////////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD///////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP///////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD///////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP//////AAAAAAAAAAAAAAD//////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//////////8AAAAAAAAAAAAA////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP//////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//////////////wAAAAAAAAAAAAD//////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD///////////////////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA////////////////////////////////AAAAAAAAAAAA//////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD///////////////////////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAA//////////////////////////////////8AAAAAAAAAAP///////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAP///////////////////////////////////////////wAAAAD//////////////////wAAAAAAAAAAAAAAAAA AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/////////////////////////////////////////////////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP///////////////////////////////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP//////////////////////////////////////////////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP///////////////////////////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//////////////////////////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD///////////////////////////////////////////////////////////////////////////////////////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//////////////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/////////////////////////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//////////////////////////////////////////////////////////////////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/////////////////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/////////////////////////////////////////////////////////////////////////////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP////////////////////////////////////////////////////////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//////////////////////////////////////////////////////////////////////wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD///////////////////////////8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA AAAAAAAD/////AP//////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP//AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA const GW=320,GH=256,ES=14.4,TW=80,TD=102.5;
const LON0=6.5,LON1=19.0,LAT0=35.5,LAT1=47.5;
const MIN_M=0,MAX_M=4810;

const _elevRaw=new Float32Array(_eu8.length);
for(let i=0;i<_eu8.length;i++)_elevRaw[i]=_eu8[i]/255;

function blur(src,w,h,n){const k=[1/16,4/16,6/16,4/16,1/16];
  let a=new Float32Array(src),b=new Float32Array(src.length);
  for(let p=0;p<n;p++){
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){let s=0;for(let d=-2;d<=2;d++)s+=k[d+2]*a[j*w+Math.max(0,Math.min(w-1,i+d))];b[j*w+i]=s;}
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){let s=0;for(let d=-2;d<=2;d++)s+=k[d+2]*b[Math.max(0,Math.min(h-1,j+d))*w+i];a[j*w+i]=s;}
  }return a;}
const elev=blur(_elevRaw,GW,GH,1);
function inCT(gi,gj){return _mu8[Math.max(0,Math.min(GH-1,gj|0))*GW+Math.max(0,Math.min(GW-1,gi|0))]>0;}

function gv(gi,gj){return elev[Math.max(0,Math.min(GH-1,Math.round(gj)))*GW+Math.max(0,Math.min(GW-1,Math.round(gi)))];}
function gvf(gi,gj){const i0=Math.max(0,Math.min(GW-2,Math.floor(gi))),j0=Math.max(0,Math.min(GH-2,Math.floor(gj)));
  const fi=gi-i0,fj=gj-j0;
  const a=elev[j0*GW+i0],b=elev[j0*GW+i0+1],c=elev[(j0+1)*GW+i0],d=elev[(j0+1)*GW+i0+1];
  return (a*(1-fi)+b*fi)*(1-fj)+(c*(1-fi)+d*fi)*fj;}
function g2w(gi,gj,dy=0){return new THREE.Vector3((gi/(GW-1)-.5)*TW,gv(gi,gj)*ES+dy,(gj/(GH-1)-.5)*TD);}
function g2wf(gi,gj,dy=0){return new THREE.Vector3((gi/(GW-1)-.5)*TW,gvf(gi,gj)*ES+dy,(gj/(GH-1)-.5)*TD);}
function ll2w(lon,lat,dy=0){const gi=(lon-LON0)/(LON1-LON0)*(GW-1),gj=(LAT1-lat)/(LAT1-LAT0)*(GH-1);return g2wf(gi,gj,dy);}

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0f0c);
scene.fog=new THREE.FogExp2(0x0a0f0c,0.0040);

const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.5,4000);

let sgi=0,sgj=0,scnt=0;
for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)if(_mu8[j*GW+i]>0){sgi+=i;sgj+=j;scnt++;}
const CENTER_GI=scnt?sgi/scnt:GW/2,CENTER_GJ=scnt?sgj/scnt:GH/2;
const centerX=(CENTER_GI/(GW-1)-.5)*TW, centerZ=(CENTER_GJ/(GH-1)-.5)*TD;
const initR=Math.max(TW,TD)*1.18;

const camTarget={th:.18,ph:.72,r:initR};
const camNow={th:.18,ph:.72,r:initR};
const tgTarget=new THREE.Vector3(centerX,3,centerZ);
const tgNow=tgTarget.clone();
function uc(){
  camNow.th+=(camTarget.th-camNow.th)*.12;
  camNow.ph+=(camTarget.ph-camNow.ph)*.12;
  camNow.r +=(camTarget.r -camNow.r )*.12;
  tgNow.lerp(tgTarget,.12);
  const r=camNow.r,ph=camNow.ph,th=camNow.th;
  camera.position.set(tgNow.x+r*Math.sin(ph)*Math.sin(th),
                      tgNow.y+r*Math.cos(ph),
                      tgNow.z+r*Math.sin(ph)*Math.cos(th));
  camera.lookAt(tgNow);
}

scene.add(new THREE.AmbientLight(0x35443a,0.6));

// === NO surface. Only lines. Single shared LIFT so grid+contours+border+labels coincide ===
const LIFT=0.06;
const gRay=new THREE.PlaneGeometry(TW,TD,GW-1,GH-1);gRay.rotateX(-Math.PI/2);
const pRay=gRay.attributes.position;
for(let idx=0;idx<GW*GH;idx++)pRay.setY(idx,(_mu8[idx]>0?elev[idx]*ES:0));
pRay.needsUpdate=true;
const rMesh=new THREE.Mesh(gRay,new THREE.MeshBasicMaterial({visible:false}));scene.add(rMesh);

// green wireframe grid (brightness follows elevation), ON by default
const wG=new THREE.Group();scene.add(wG);
(function buildWire(){const S=9;
  const addLine=(pts,v)=>{if(pts.length<2)return;const br=.28+v*.55;
    wG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:new THREE.Color(br*.42,br*.95,br*.55),transparent:true,opacity:.20})));};
  for(let j=0;j<GH;j+=S){let seg=[],v=gv(GW>>1,j);for(let i=0;i<GW;i++){if(inCT(i,j))seg.push(g2w(i,j,LIFT));else{addLine(seg,v);seg=[];}}addLine(seg,v);}
  for(let i=0;i<GW;i+=S){let seg=[],v=gv(i,GH>>1);for(let j=0;j<GH;j++){if(inCT(i,j))seg.push(g2w(i,j,LIFT));else{addLine(seg,v);seg=[];}}addLine(seg,v);}
})();

function march(iso){const segs=[],lp=(x0,y0,x1,y1,v0,v1)=>{const t=(iso-v0)/(v1-v0+1e-9);return[x0+t*(x1-x0),y0+t*(y1-y0)];};
  for(let j=0;j<GH-1;j++)for(let i=0;i<GW-1;i++){
    if(!inCT(i,j)&&!inCT(i+1,j)&&!inCT(i,j+1)&&!inCT(i+1,j+1))continue;
    const a=elev[j*GW+i],b=elev[j*GW+i+1],c=elev[(j+1)*GW+i],d=elev[(j+1)*GW+i+1];
    const code=(a>=iso?1:0)|(b>=iso?2:0)|(d>=iso?4:0)|(c>=iso?8:0);
    if(!code||code===15)continue;
    const T=lp(i,j,i+1,j,a,b),R=lp(i+1,j,i+1,j+1,b,d),B=lp(i+1,j+1,i,j+1,d,c),L=lp(i,j+1,i,j,c,a);
    const ps=(u,v)=>segs.push([...u,...v]);
    switch(code){case 1:case 14:ps(T,L);break;case 2:case 13:ps(T,R);break;case 3:case 12:ps(L,R);break;
      case 4:case 11:ps(R,B);break;case 5:ps(T,R);ps(B,L);break;case 6:case 9:ps(T,B);break;
      case 7:case 8:ps(L,B);break;case 10:ps(T,L);ps(R,B);break;}
  }return segs;}
function chain(segs,tol=.5){const used=new Uint8Array(segs.length),out=[];
  for(let s=0;s<segs.length;s++){if(used[s])continue;used[s]=1;
    const c=[[segs[s][0],segs[s][1]],[segs[s][2],segs[s][3]]];let chg=true;
    while(chg){chg=false;const h=c[0],t=c[c.length-1];
      for(let i=0;i<segs.length;i++){if(used[i])continue;const ax=segs[i][0],ay=segs[i][1],bx=segs[i][2],by=segs[i][3];
        if(Math.hypot(ax-t[0],ay-t[1])<tol){c.push([bx,by]);used[i]=1;chg=true;}
        else if(Math.hypot(bx-t[0],by-t[1])<tol){c.push([ax,ay]);used[i]=1;chg=true;}
        else if(Math.hypot(ax-h[0],ay-h[1])<tol){c.unshift([bx,by]);used[i]=1;chg=true;}
        else if(Math.hypot(bx-h[0],by-h[1])<tol){c.unshift([ax,ay]);used[i]=1;chg=true;}}}
    if(c.length>=4)out.push(c);}return out;}

// BEAUTIFUL GREEN CONTOURS: deep forest -> luminous mint, glow + crisp line
function greenFor(t){
  const lo=[0.10,0.26,0.16], hi=[0.74,0.98,0.80];
  const f=Math.pow(t,0.78);
  return new THREE.Color(lo[0]+(hi[0]-lo[0])*f, lo[1]+(hi[1]-lo[1])*f, lo[2]+(hi[2]-lo[2])*f);
}
const cG=new THREE.Group();scene.add(cG);
(function buildContours(){let idx=0;
  const STEP=0.035;
  for(let iso=STEP;iso<=.985;iso+=STEP,idx++){const maj=(idx%5===0);
    for(const ch of chain(march(iso))){
      if(ch.length<5)continue;
      const pts=ch.map(c=>g2wf(c[0],c[1],LIFT));if(pts.length<2)continue;
      const curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.5);
      const sp=curve.getPoints(Math.min(pts.length*4,900));
      const pa=new Float32Array(sp.length*3);
      sp.forEach((p,i)=>{pa[i*3]=p.x;pa[i*3+1]=p.y;pa[i*3+2]=p.z;});
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pa,3));
      const col=greenFor(iso);
      const glowCol=col.clone().multiplyScalar(0.6);
      cG.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:glowCol,transparent:true,
        opacity:maj?0.30:0.14,blending:THREE.AdditiveBlending,depthWrite:false})));
      cG.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:col,transparent:true,
        opacity:maj?0.95:0.5,depthWrite:false})));

(function buildBorder(){
  for(const oneBorder of BORDERS_GRID){
    if(oneBorder.length<4)continue;
    const ctrl=oneBorder.map(p=>new THREE.Vector2(p[0],p[1]));
    const dense=[];
    for(let i=0;i<ctrl.length-1;i++){
      const p0=ctrl[Math.max(0,i-1)],p1=ctrl[i],p2=ctrl[i+1],p3=ctrl[Math.min(ctrl.length-1,i+2)];
      for(let s=0;s<3;s++){const t=s/3,t2=t*t,t3=t2*t;
        dense.push([0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
                    0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)]);}}
    dense.push([ctrl[ctrl.length-1].x,ctrl[ctrl.length-1].y]);
    const pts=dense.map(c=>g2wf(c[0],c[1],LIFT));
    const mk=(col,op,dy)=>{const p2=pts.map(p=>new THREE.Vector3(p.x,p.y+dy,p.z));
      const g=new THREE.BufferGeometry().setFromPoints(p2);
      return new THREE.Line(g,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op}));};
    bG.add(mk(0x0a1812,.30,.0));
    bG.add(mk(0x3a6b42,.55,.04));
    const glow=mk(0xc4e0bd,.95,.08);bG.add(glow);bGlow=glow;
  }
})();

const evPins=[],evCards=[],evV=[],evData=[],evSmooth=[];let sE=true;
async function loadEvents(){let evs=null;
  if(window.GEOINT_EVENTS)evs=window.GEOINT_EVENTS;
  else{for(const u of ['../events.json','./events.json','../../events.json']){
    try{const r=await fetch(u);if(r.ok){const j=await r.json();evs=(j.events||j||[]);break;}}catch(_){}}}
  if(!evs)return;
  const inBox=(lat,lon)=>(lat>=LAT0&&lat<=LAT1&&lon>=LON0&&lon<=LON1);
  evs.filter(e=>e&&typeof e.lat==='number'&&typeof e.lng==='number'&&inBox(e.lat,e.lng)).forEach(e=>{
    evData.push(e);evV.push(ll2w(e.lng,e.lat,LIFT+0.5));evSmooth.push({x:0,y:0,init:false});
    const pin=document.createElement('div');pin.className='ev-pin';document.getElementById('app').appendChild(pin);evPins.push(pin);
    const card=document.createElement('div');card.className='ev-card';
    const sev=Math.max(1,Math.min(5,e.severity||3));const safe=s=>(s||'').replace(/[<>]/g,'');
    card.innerHTML=(e.image?`<img class="ev-img" src="${e.image}" onerror="this.style.display='none'">`:'')
      +`<div class="ev-t">${safe(e.title||'Untitled')}</div>`
      +`<div class="ev-meta"><span class="ev-sev ev-sev${sev}"></span>${safe(e.location||'')} &middot; SEV ${sev}</div>`
      +`<div class="ev-d">${safe(e.description||'').slice(0,260)}</div>`;
    document.getElementById('app').appendChild(card);evCards.push(card);
    let open=false;
    pin.addEventListener('click',ev=>{ev.stopPropagation();open=!open;card.style.display=open?'block':'none';});
    pin.addEventListener('mouseenter',()=>{if(!open)card.style.display='block';});
    pin.addEventListener('mouseleave',()=>{if(!open)card.style.display='none';});
  });
  evPins.forEach(p=>p.style.display=sE?'block':'none');
}loadEvents();

let fr=0;const tv=new THREE.Vector3();const SM=0.45;
function project(v){tv.copy(v).project(camera);if(tv.z>=1)return null;
  return{x:(tv.x*.5+.5)*innerWidth,y:(-tv.y*.5+.5)*innerHeight};}

function animate(){requestAnimationFrame(animate);fr++;uc();
  if(bGlow)bGlow.material.opacity=.78+.18*Math.sin(fr*.04);
  const placed=[];
  for(let i=0;i<labels.length;i++){const it=labels[i];const show=it.p.isPeak?sP:sCty;
    if(!show){it.dot.style.display='none';it.lbl.style.display='none';continue;}
    const pt=project(it.v);
    if(!pt){it.dot.style.display='none';it.lbl.style.display='none';it.smooth.init=false;continue;}
    if(!it.smooth.init){it.smooth.x=pt.x;it.smooth.y=pt.y;it.smooth.init=true;}
    else{it.smooth.x+=(pt.x-it.smooth.x)*SM;it.smooth.y+=(pt.y-it.smooth.y)*SM;}
    const sx=it.smooth.x,sy=it.smooth.y,lblX=sx+9,lblY=sy-it.h+2;
    const bx1=lblX-2,by1=lblY-2,bx2=lblX+it.w+2,by2=lblY+it.h+2;
    let collide=false;for(const p of placed){if(bx1<p.x2&&bx2>p.x1&&by1<p.y2&&by2>p.y1){collide=true;break;}}
    it.dot.style.transform=`translate3d(${sx.toFixed(2)}px,${sy.toFixed(2)}px,0)`;
    if(it.dot.style.display!=='block')it.dot.style.display='block';
    if(collide){if(it.lbl.style.display!=='none')it.lbl.style.display='none';}
    else{it.lbl.style.transform=`translate3d(${lblX.toFixed(2)}px,${lblY.toFixed(2)}px,0)`;
      if(it.lbl.style.display!=='block')it.lbl.style.display='block';placed.push({x1:bx1,y1:by1,x2:bx2,y2:by2});}}
  if(sE)for(let i=0;i<evV.length;i++){const pt=project(evV[i]);
    if(!pt){if(evPins[i].style.display!=='none')evPins[i].style.display='none';if(evCards[i].style.display!=='none')evCards[i].style.display='none';evSmooth[i].init=false;continue;}
    if(!evSmooth[i].init){evSmooth[i].x=pt.x;evSmooth[i].y=pt.y;evSmooth[i].init=true;}
    else{evSmooth[i].x+=(pt.x-evSmooth[i].x)*SM;evSmooth[i].y+=(pt.y-evSmooth[i].y)*SM;}
    evPins[i].style.transform=`translate3d(${evSmooth[i].x.toFixed(2)}px,${evSmooth[i].y.toFixed(2)}px,0)`;
    if(evPins[i].style.display!=='block')evPins[i].style.display='block';
    evCards[i].style.transform=`translate3d(${(evSmooth[i].x+14).toFixed(2)}px,${(evSmooth[i].y-10).toFixed(2)}px,0)`;}
  if(fr%6===0){ray.setFromCamera(mxy,camera);const h=ray.intersectObject(rMesh);
    if(h.length){const p=h[0].point,nx=p.x/TW+.5,nz=p.z/TD+.5;
      const lat=(LAT1-nz*(LAT1-LAT0)),lon=(LON0+nx*(LON1-LON0));
      const gi=Math.max(0,Math.min(GW-1,~~(nx*(GW-1)))),gj=Math.max(0,Math.min(GH-1,~~(nz*(GH-1))));
      const em=~~(MIN_M+elev[gj*GW+gi]*(MAX_M-MIN_M));

        `LAT &nbsp;<b>${Math.abs(lat).toFixed(3)}&deg; ${lat>=0?'N':'S'}</b><br>LON &nbsp;<b>${Math.abs(lon).toFixed(3)}&deg; ${lon>=0?'E':'W'}</b><br>ELEV &nbsp;<b>${em} m</b><br>`+

  renderer.render(scene,camera);
}animate();
