<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GEOINT · France 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131a17;--bg-deep:#0a110d;--border:rgba(190,207,184,.12);
  --border-h:rgba(190,207,184,.22);--accent:#8aad84;--accent-bright:#b9d5b3;
  --accent-dim:#5a7d54;--text:#9aaa97;--text-dim:#5a6d5e;
  --white:#d5d8d2;--bright:#e8ebe5;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
#app{width:100%;height:100%;position:relative;background:var(--bg)}
#app canvas{display:block;cursor:grab}
#app canvas:active{cursor:grabbing}

#hud{position:absolute;top:14px;left:16px;z-index:10;pointer-events:none;
  border-left:2px solid var(--accent);padding:10px 14px;
  background:linear-gradient(90deg,rgba(10,17,13,.92),rgba(10,17,13,.5));border-radius:0 3px 3px 0}
.ht{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:2.6px;color:var(--accent-bright)}
.hs{font-family:var(--mono);font-size:8.5px;letter-spacing:1.6px;color:var(--accent-dim);margin-top:3px}
.hb{font-family:var(--mono);font-size:9px;color:var(--text);margin-top:10px;line-height:1.85;letter-spacing:.4px}
.hb b{color:var(--accent-bright);font-weight:500}
.hb .sep{color:#1a2a20;letter-spacing:0}

#lw{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:10;pointer-events:none;display:flex;align-items:stretch;gap:8px}
#ll{display:flex;flex-direction:column;justify-content:space-between;height:200px;text-align:right}
#ll span{font-family:var(--mono);font-size:8.5px;color:var(--text-dim);letter-spacing:.6px}
#lb{width:10px;height:200px;border:1px solid var(--border);border-radius:1px}

#ctrl{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;
  background:rgba(10,17,13,.7);padding:4px;border-radius:4px;border:1px solid var(--border);backdrop-filter:blur(6px)}
.btn{background:transparent;border:1px solid transparent;color:var(--text-dim);
  font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:1.1px;padding:7px 13px;
  cursor:pointer;text-transform:uppercase;transition:all .15s;border-radius:3px}
.btn:hover{background:rgba(138,173,132,.07);color:var(--accent-bright)}
.btn.on{background:rgba(138,173,132,.13);border-color:var(--accent-dim);color:var(--accent-bright)}

#ftog{position:absolute;top:14px;right:16px;z-index:10;background:rgba(10,17,13,.85);
  border:1px solid var(--border-h);color:var(--accent);font-family:var(--sans);font-size:10px;font-weight:500;
  padding:7px 12px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;border-radius:3px;
  transition:all .15s;display:flex;align-items:center;gap:6px}
#ftog:hover{background:rgba(138,173,132,.13);color:var(--accent-bright);border-color:var(--accent)}
#ftog svg{width:11px;height:11px;fill:currentColor}

/* Labels — peak (mountain) vs city differentiation */
.lbl{position:fixed;left:0;top:0;font-family:var(--mono);font-size:9px;letter-spacing:.7px;
  pointer-events:none;white-space:pre;display:none;will-change:transform;
  line-height:1.2;font-weight:500;transform:translate3d(0,0,0)}
.lbl-peak{color:var(--accent-bright);
  text-shadow:0 0 5px rgba(10,17,13,.95),0 1px 3px #000,0 0 1px rgba(185,213,179,.6)}
.lbl-city{color:#c5d4be;font-weight:400;font-size:8.5px;
  text-shadow:0 0 4px rgba(10,17,13,.95),0 1px 2px #000}
.lbl .nm{display:block}
.lbl .h{display:block;font-size:7.5px;opacity:.78;color:var(--accent);margin-top:1px;font-weight:400;letter-spacing:.4px}

.dot{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;display:none;
  will-change:transform;z-index:9;transform:translate3d(0,0,0)}
.dot-peak{width:5px;height:5px;margin:-2.5px 0 0 -2.5px;background:var(--accent-bright);
  box-shadow:0 0 7px var(--accent),0 0 2px #fff}
.dot-city{width:3.5px;height:3.5px;margin:-1.75px 0 0 -1.75px;background:#c5d4be;
  box-shadow:0 0 4px rgba(138,173,132,.7),0 0 1px #fff;opacity:.85}

.ev-pin{position:fixed;left:0;top:0;width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffb380,#c4736a 60%,#7a2a20 100%);
  box-shadow:0 0 0 2px rgba(195,112,102,.25),0 0 12px rgba(195,112,102,.7),0 0 4px #fff;
  pointer-events:auto;cursor:pointer;display:none;will-change:transform;z-index:11;
  margin:-7px 0 0 -7px;animation:evPulse 2.2s ease-in-out infinite;transform:translate3d(0,0,0)}
@keyframes evPulse{
  0%,100%{box-shadow:0 0 0 2px rgba(195,112,102,.25),0 0 10px rgba(195,112,102,.65),0 0 4px #fff}
  50%{box-shadow:0 0 0 4px rgba(195,112,102,.18),0 0 18px rgba(195,112,102,.85),0 0 6px #fff}
}
.ev-card{position:fixed;left:0;top:0;width:260px;
  background:linear-gradient(180deg,rgba(20,30,26,.97),rgba(10,17,13,.97));
  border:1px solid var(--accent-dim);border-radius:4px;padding:10px 12px;
  font-family:var(--sans);color:var(--white);font-size:11px;pointer-events:auto;display:none;z-index:12;
  box-shadow:0 8px 28px rgba(0,0,0,.6),0 0 0 1px rgba(138,173,132,.08);
  backdrop-filter:blur(12px);will-change:transform;transform:translate3d(0,0,0)}
.ev-card .ev-t{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--bright);
  line-height:1.3;margin-bottom:5px;letter-spacing:.1px}
.ev-card .ev-meta{font-family:var(--mono);font-size:8.5px;color:var(--accent);
  letter-spacing:.8px;text-transform:uppercase;margin-bottom:7px}
.ev-card .ev-d{font-size:10.5px;color:var(--text);line-height:1.55}
.ev-card .ev-img{width:100%;height:80px;object-fit:cover;border-radius:3px;
  margin-bottom:7px;border:1px solid var(--border);background:#0a110d}
.ev-card .ev-sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.ev-card .ev-sev1{background:#6b9e6f}.ev-card .ev-sev2{background:#b89a4a}
.ev-card .ev-sev3{background:#e0893a}.ev-card .ev-sev4{background:#c27066}
.ev-card .ev-sev5{background:#c0392b}

#info{position:absolute;bottom:16px;right:16px;z-index:10;
  font-family:var(--mono);font-size:8.5px;color:var(--text-dim);letter-spacing:.6px;
  line-height:1.7;text-align:right;pointer-events:none}
#info b{color:var(--accent);font-weight:500}
#app.fs-css{position:fixed!important;top:0;left:0;width:100vw;height:100vh;z-index:9999}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="ht">GEOINT · FRANCE</div>
    <div class="hs">DEM v9 · FRA · WGS84</div>
    <div class="hb" id="coords">
      LAT &nbsp;<b>41.0° N – 51.5° N</b><br>
      LON &nbsp;<b>5.5° W – 10.0° E</b><br>
      ELEV &nbsp;<b>—</b><br>
      <span class="sep">─────────────────</span><br>
      MAX &nbsp;<b>4810 m</b><br>
      GRID &nbsp;320 × 256
    </div>
  </div>
  <div id="lw">
    <div id="ll"><span>4810m</span><span>3174m</span><span>1924m</span><span>865m</span><span>0m</span></div>
    <canvas id="lb" width="10" height="200"></canvas>
  </div>
  <div id="ctrl">
    <button class="btn on" id="bc">Contours</button>
    <button class="btn on" id="bw">Wireframe</button>
    <button class="btn on" id="bb">Border</button>
    <button class="btn on" id="bp">Peaks</button>
    <button class="btn on" id="bcty">Cities</button>
    <button class="btn on" id="be">Events</button>
    <button class="btn"    id="br">Reset</button>
  </div>
  <button id="ftog" title="Toggle fullscreen">
    <svg viewBox="0 0 16 16"><path d="M2 2h4v1.5H3.5V6H2V2zm12 0v4h-1.5V3.5H10V2h4zM2 14v-4h1.5v2.5H6V14H2zm12 0h-4v-1.5h2.5V10H14v4z"/></svg>
    <span id="flbl">Fullscreen</span>
  </button>
  <div id="info"><b>DRAG</b> rotate · <b>RIGHT</b> pan · <b>WHEEL</b> zoom</div>
</div>

function blur(src,w,h,n){const k=[1/16,4/16,6/16,4/16,1/16];
  let a=new Float32Array(src),b=new Float32Array(src.length);
  for(let p=0;p<n;p++){
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){let s=0;for(let d=-2;d<=2;d++)s+=k[d+2]*a[j*w+Math.max(0,Math.min(w-1,i+d))];b[j*w+i]=s;}
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){let s=0;for(let d=-2;d<=2;d++)s+=k[d+2]*b[Math.max(0,Math.min(h-1,j+d))*w+i];a[j*w+i]=s;}
  }return a;
}

function gvf(gi,gj){const i0=Math.max(0,Math.min(GW-2,Math.floor(gi))),j0=Math.max(0,Math.min(GH-2,Math.floor(gj)));

function march(iso){const segs=[],lp=(x0,y0,x1,y1,v0,v1)=>{const t=(iso-v0)/(v1-v0+1e-9);return[x0+t*(x1-x0),y0+t*(y1-y0)];};
  for(let j=0;j<GH-1;j++)for(let i=0;i<GW-1;i++){
    if(!inCT(i,j)&&!inCT(i+1,j)&&!inCT(i,j+1)&&!inCT(i+1,j+1))continue;
    const a=elev[j*GW+i],b=elev[j*GW+i+1],c=elev[(j+1)*GW+i],d=elev[(j+1)*GW+i+1];
    const code=(a>=iso?1:0)|(b>=iso?2:0)|(d>=iso?4:0)|(c>=iso?8:0);
    if(!code||code===15)continue;
    const T=lp(i,j,i+1,j,a,b),R=lp(i+1,j,i+1,j+1,b,d),B=lp(i+1,j+1,i,j+1,d,c),L=lp(i,j+1,i,j,c,a);
    const ps=(u,v)=>segs.push([...u,...v]);
    switch(code){case 1:case 14:ps(T,L);break;case 2:case 13:ps(T,R);break;case 3:case 12:ps(L,R);break;
      case 4:case 11:ps(R,B);break;case 5:ps(T,R);ps(B,L);break;case 6:case 9:ps(T,B);break;
      case 7:case 8:ps(L,B);break;case 10:ps(T,L);ps(R,B);break;}
  }return segs;}
function chain(segs,tol=.48){const used=new Uint8Array(segs.length),out=[];
  for(let s=0;s<segs.length;s++){if(used[s])continue;used[s]=1;
    const c=[[segs[s][0],segs[s][1]],[segs[s][2],segs[s][3]]];let chg=true;
    while(chg){chg=false;const h=c[0],t=c[c.length-1];
      for(let i=0;i<segs.length;i++){if(used[i])continue;
        const[ax,ay,bx,by]=segs[i];
        if(Math.hypot(ax-t[0],ay-t[1])<tol){c.push([bx,by]);used[i]=1;chg=true;}
        else if(Math.hypot(bx-t[0],by-t[1])<tol){c.push([ax,ay]);used[i]=1;chg=true;}
        else if(Math.hypot(ax-h[0],ay-h[1])<tol){c.unshift([bx,by]);used[i]=1;chg=true;}
        else if(Math.hypot(bx-h[0],by-h[1])<tol){c.unshift([ax,ay]);used[i]=1;chg=true;}
      }
    }if(c.length>=4)out.push(c);
  }return out;}
function cCol(t){const S=[[.00,[.18,.30,.22]],[.18,[.28,.46,.34]],[.36,[.42,.62,.46]],
    [.52,[.56,.74,.55]],[.68,[.72,.86,.66]],[.82,[.86,.92,.78]],[.94,[.96,.97,.90]],[1.0,[1.00,1.00,1.00]]];
  let a=S[0],b=S[S.length-1];
  for(let i=0;i<S.length-1;i++)if(t>=S[i][0]&&t<=S[i+1][0]){a=S[i];b=S[i+1];break;}
  const f=(t-a[0])/(b[0]-a[0]+1e-9);
  return new THREE.Color(a[1][0]+(b[1][0]-a[1][0])*f,a[1][1]+(b[1][1]-a[1][1])*f,a[1][2]+(b[1][2]-a[1][2])*f);
}
const cG=new THREE.Group();scene.add(cG);
function buildContours(){while(cG.children.length)cG.remove(cG.children[0]);let idx=0;
  for(let iso=.040;iso<=.96;iso+=.040,idx++){const maj=(idx%5===0);
    for(const ch of chain(march(iso))){
      if(ch.length<5)continue;  // filter spurious tiny contours
      const pts=ch.map(([gi,gj])=>g2w(gi,gj,.04));if(pts.length<2)continue;
      const curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.5);
      const sp2=curve.getPoints(Math.min(pts.length*4,700));
      const pa=new Float32Array(sp2.length*3);
      sp2.forEach((p,i)=>{pa[i*3]=p.x;pa[i*3+1]=p.y;pa[i*3+2]=p.z;});
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pa,3));
      const col=cCol(iso);
      cG.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:maj?0.90:.48})));
    }
  }

    // Smooth slightly with Catmull-Rom, then convert to world coords on the DEM.
    const ctrl=oneBorder.map(p=>new THREE.Vector2(p[0],p[1]));
    const dense=[];
    for(let i=0;i<ctrl.length-1;i++){
      const p0=ctrl[Math.max(0,i-1)],p1=ctrl[i],p2=ctrl[i+1],p3=ctrl[Math.min(ctrl.length-1,i+2)];
      for(let s=0;s<3;s++){
        const t=s/3,t2=t*t,t3=t2*t;
        const x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
        const y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
        dense.push([x,y]);
      }
    }
    dense.push([ctrl[ctrl.length-1].x,ctrl[ctrl.length-1].y]);
    // Use elev-aware projection (g2wf) so border hugs terrain
    const pts=dense.map(([gi,gj])=>g2wf(gi,gj,.18));
    const mk=(col,op,dy)=>{
      const p2=pts.map(p=>new THREE.Vector3(p.x,p.y+dy,p.z));
      const g=new THREE.BufferGeometry().setFromPoints(p2);
      return new THREE.Line(g,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op}));
    };
    bG.add(mk(0x0a1812,.25,.16));
    bG.add(mk(0x2e5236,.60,.08));
    bG.add(mk(0xb9d5b3,.95,0));
  }
}buildBorder();

(()=>{const lc=document.getElementById('lb');lc.width=10;lc.height=200;
  const ctx=lc.getContext('2d'),g=ctx.createLinearGradient(0,0,0,200);
  for(let i=0;i<=20;i++){const t=1-i/20,c=cCol(t);g.addColorStop(i/20,`rgb(${~~(c.r*255)},${~~(c.g*255)},${~~(c.b*255)})`);}
  ctx.fillStyle=g;ctx.fillRect(0,0,10,200);
})();

// === LABELS with priority + declutter ===
// h >= 800m → peak; else → city. Priority: high peaks > big cities > small peaks > small cities
const ALL_PKS=[{"n": "MONT BLANC", "lon": 6.852, "lat": 45.852, "h": 4810}, {"n": "BARRE ECRINS", "lon": 6.358, "lat": 44.918, "h": 4102}, {"n": "LA MEIJE", "lon": 6.318, "lat": 44.974, "h": 3984}, {"n": "VIGNEMALE", "lon": -0.146, "lat": 42.77, "h": 3298}, {"n": "PIC DU MIDI", "lon": 0.14, "lat": 42.937, "h": 2877}, {"n": "PUY DE SANCY", "lon": 2.813, "lat": 45.529, "h": 1885}, {"n": "GRAND BALLON", "lon": 7.099, "lat": 47.901, "h": 1424}, {"n": "CRET DE LA NEIGE", "lon": 5.985, "lat": 46.272, "h": 1720}, {"n": "PARIS", "lon": 2.349, "lat": 48.857, "h": 35}, {"n": "LYON", "lon": 4.835, "lat": 45.764, "h": 173}, {"n": "MARSEILLE", "lon": 5.37, "lat": 43.296, "h": 12}, {"n": "BORDEAUX", "lon": -0.578, "lat": 44.838, "h": 6}, {"n": "TOULOUSE", "lon": 1.444, "lat": 43.604, "h": 146}, {"n": "NANTES", "lon": -1.553, "lat": 47.218, "h": 8}, {"n": "STRASBOURG", "lon": 7.752, "lat": 48.583, "h": 132}, {"n": "LILLE", "lon": 3.058, "lat": 50.629, "h": 21}, {"n": "NICE", "lon": 7.262, "lat": 43.71, "h": 15}, {"n": "RENNES", "lon": -1.679, "lat": 48.117, "h": 30}];
// Compute priority: peak(elevation/100) , city(population not avail, so use elevation low + name length)
// Better: peaks always priority 100+h; cities priority 50.
ALL_PKS.forEach(p=>{
  p.isPeak = p.h >= 800;
  p.priority = p.isPeak ? (200 + p.h/30) : 100;  // peaks always rank higher
});
// Sort by priority desc → high-priority labels get visibility first
ALL_PKS.sort((a,b)=>b.priority-a.priority);

const labels=[];
ALL_PKS.forEach(p=>{
  const v=ll2w(p.lon,p.lat, p.isPeak ? 0.5 : 0.3);
  const dot=document.createElement('div');
  dot.className='dot '+(p.isPeak?'dot-peak':'dot-city');
  document.getElementById('app').appendChild(dot);
  const lbl=document.createElement('div');
  lbl.className='lbl '+(p.isPeak?'lbl-peak':'lbl-city');
  lbl.innerHTML=`<span class="nm">${p.n}</span><span class="h">${p.h}m</span>`;
  document.getElementById('app').appendChild(lbl);
  labels.push({p,v,dot,lbl,smooth:{x:0,y:0,init:false},visible:true,
    w:Math.max(40,p.n.length*5.5+8),h:24});
});
let sP=true, sCty=true;

// === EVENTS ===
const evPins=[],evCards=[],evV=[],evData=[],evSmooth=[];
let sE=true;
async function loadEvents(){let evs=null;
  if(window.GEOINT_EVENTS)evs=window.GEOINT_EVENTS;
  else{for(const u of ['../events.json','./events.json','../../events.json']){
      try{const r=await fetch(u);if(r.ok){const j=await r.json();evs=(j.events||j||[]);break;}}catch(_){}}}
  if(!evs)return;
  const inBox=(lat,lon)=>(lat>=LAT0&&lat<=LAT1&&lon>=LON0&&lon<=LON1);
  evs.filter(e=>e&&typeof e.lat==='number'&&typeof e.lng==='number'&&inBox(e.lat,e.lng)).forEach(e=>{
    evData.push(e);evV.push(ll2w(e.lng,e.lat,1.2));
    evSmooth.push({x:0,y:0,init:false});
    const pin=document.createElement('div');pin.className='ev-pin';
    document.getElementById('app').appendChild(pin);evPins.push(pin);
    const card=document.createElement('div');card.className='ev-card';
    const sev=Math.max(1,Math.min(5,e.severity||3));
    const safe=s=>(s||'').replace(/[<>]/g,'');
    card.innerHTML=(e.image?`<img class="ev-img" src="${e.image}" onerror="this.style.display='none'">`:'')
      +`<div class="ev-t">${safe(e.title||'Untitled')}</div>`
      +`<div class="ev-meta"><span class="ev-sev ev-sev${sev}"></span>${safe(e.location||'')} · SEV ${sev}</div>`
      +`<div class="ev-d">${safe(e.description||'').slice(0,260)}</div>`;
    document.getElementById('app').appendChild(card);evCards.push(card);
    let open=false;
    pin.addEventListener('click',ev=>{ev.stopPropagation();open=!open;card.style.display=open?'block':'none';});
    pin.addEventListener('mouseenter',()=>{if(!open)card.style.display='block';});
    pin.addEventListener('mouseleave',()=>{if(!open)card.style.display='none';});
  });
  evPins.forEach(p=>p.style.display='block');
}loadEvents();

let sC=true,sW=true,sB=true;
document.getElementById('bc').onclick=function(){sC=!sC;cG.visible=sC;this.classList.toggle('on',sC);};
document.getElementById('bw').onclick=function(){sW=!sW;wG.visible=sW;this.classList.toggle('on',sW);};
document.getElementById('bb').onclick=function(){sB=!sB;bG.visible=sB;this.classList.toggle('on',sB);};
document.getElementById('bp').onclick=function(){sP=!sP;this.classList.toggle('on',sP);};
document.getElementById('bcty').onclick=function(){sCty=!sCty;this.classList.toggle('on',sCty);};
document.getElementById('be').onclick=function(){sE=!sE;this.classList.toggle('on',sE);
  evPins.forEach(p=>p.style.display=sE?'block':'none');if(!sE)evCards.forEach(c=>c.style.display='none');};
document.getElementById('br').onclick=()=>{
  camTarget.th=.08;camTarget.ph=.74;camTarget.r=initR;tgTarget.set(centerX,2,centerZ);};

const appEl=document.getElementById('app');
const fbtn=document.getElementById('ftog'),flbl=document.getElementById('flbl');
function isFs(){return !!(document.fullscreenElement||document.webkitFullscreenElement||appEl.classList.contains('fs-css'));}
function updateFsLabel(){flbl.textContent=isFs()?'Exit':'Fullscreen';}
fbtn.onclick=async()=>{
  try{if(!isFs()){if(appEl.requestFullscreen)await appEl.requestFullscreen();
    else if(appEl.webkitRequestFullscreen)appEl.webkitRequestFullscreen();
    else appEl.classList.add('fs-css');}
  else{if(document.exitFullscreen)await document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    else appEl.classList.remove('fs-css');}
  }catch(_){appEl.classList.toggle('fs-css');}
  setTimeout(()=>{onResize();updateFsLabel();},80);
};
document.addEventListener('fullscreenchange',()=>{onResize();updateFsLabel();});
document.addEventListener('webkitfullscreenchange',()=>{onResize();updateFsLabel();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&appEl.classList.contains('fs-css')){appEl.classList.remove('fs-css');onResize();updateFsLabel();}});
function onResize(){const w=appEl.clientWidth||innerWidth,h=appEl.clientHeight||innerHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}
window.addEventListener('resize',onResize);

const ray=new THREE.Raycaster(),mxy=new THREE.Vector2();
window.addEventListener('mousemove',e=>{mxy.x=(e.clientX/innerWidth)*2-1;mxy.y=-(e.clientY/innerHeight)*2+1;});
let fr=0;const tv=new THREE.Vector3();
const SMOOTH_LERP=0.45;

function project(v){
  tv.copy(v).project(camera);
  if(tv.z>=1)return null;
  return {x:(tv.x*.5+.5)*innerWidth, y:(-tv.y*.5+.5)*innerHeight};
}

function animate(){requestAnimationFrame(animate);fr++;uc();
  const pulse=.78+.18*Math.sin(fr*.04);
  if(bG.children[2])bG.children[2].material.opacity=pulse;

  // === LABEL DECLUTTER ===
  // Step 1: project all labels
  // Step 2: sort by priority (already sorted), then iterate placing each;
  //         if its bbox would overlap an already-placed higher-priority label,
  //         hide it. Smooth positions per-frame.
  const placed=[];  // array of {x1,y1,x2,y2,prio}
  for(let i=0;i<labels.length;i++){
    const it=labels[i];
    const isPeak=it.p.isPeak;
    const show=isPeak?sP:sCty;
    if(!show){
      it.dot.style.display='none';it.lbl.style.display='none';continue;
    }
    const pt=project(it.v);
    if(!pt){
      it.dot.style.display='none';it.lbl.style.display='none';
      it.smooth.init=false;continue;
    }
    // smoothed coords
    if(!it.smooth.init){it.smooth.x=pt.x;it.smooth.y=pt.y;it.smooth.init=true;}
    else{it.smooth.x+=(pt.x-it.smooth.x)*SMOOTH_LERP;it.smooth.y+=(pt.y-it.smooth.y)*SMOOTH_LERP;}
    const sx=it.smooth.x, sy=it.smooth.y;
    // label bbox (label sits 14px right of dot, 14px up)
    const lblX = sx+10, lblY = sy-it.h+4;
    const bx1 = lblX-2, by1 = lblY-2, bx2 = lblX+it.w+2, by2 = lblY+it.h+2;
    // collision test against higher-priority bboxes (peaks first → cities later)
    let collide=false;
    for(const p of placed){
      if(bx1<p.x2 && bx2>p.x1 && by1<p.y2 && by2>p.y1){collide=true;break;}
    }
    // dot always visible if onscreen
    it.dot.style.transform=`translate3d(${sx.toFixed(2)}px,${sy.toFixed(2)}px,0)`;
    if(it.dot.style.display!=='block')it.dot.style.display='block';
    if(collide){
      if(it.lbl.style.display!=='none')it.lbl.style.display='none';
    } else {
      it.lbl.style.transform=`translate3d(${lblX.toFixed(2)}px,${lblY.toFixed(2)}px,0)`;
      if(it.lbl.style.display!=='block')it.lbl.style.display='block';
      placed.push({x1:bx1,y1:by1,x2:bx2,y2:by2});
    }
  }

  // Events
  if(sE)for(let i=0;i<evV.length;i++){
    const pt=project(evV[i]);
    if(!pt){if(evPins[i].style.display!=='none')evPins[i].style.display='none';
      if(evCards[i].style.display!=='none')evCards[i].style.display='none';
      evSmooth[i].init=false;continue;}
    if(!evSmooth[i].init){evSmooth[i].x=pt.x;evSmooth[i].y=pt.y;evSmooth[i].init=true;}
    else{evSmooth[i].x+=(pt.x-evSmooth[i].x)*SMOOTH_LERP;evSmooth[i].y+=(pt.y-evSmooth[i].y)*SMOOTH_LERP;}
    evPins[i].style.transform=`translate3d(${evSmooth[i].x.toFixed(2)}px,${evSmooth[i].y.toFixed(2)}px,0)`;
    if(evPins[i].style.display!=='block')evPins[i].style.display='block';
    evCards[i].style.transform=`translate3d(${(evSmooth[i].x+14).toFixed(2)}px,${(evSmooth[i].y-10).toFixed(2)}px,0)`;
  }

  if(fr%6===0){ray.setFromCamera(mxy,camera);const h=ray.intersectObject(rMesh);
    if(h.length){const p=h[0].point,nx=p.x/TW+.5,nz=p.z/TD+.5;
      const lat=(LAT1-nz*(LAT1-LAT0)).toFixed(3),lon=(LON0+nx*(LON1-LON0)).toFixed(3);
      const gi=Math.max(0,Math.min(GW-1,~~(nx*(GW-1)))),gj=Math.max(0,Math.min(GH-1,~~(nz*(GH-1))));
      const em=~~(MIN_M+elev[gj*GW+gi]*(MAX_M-MIN_M));
      const lonD=parseFloat(lon),latD=parseFloat(lat);
      document.getElementById('coords').innerHTML=
        `LAT &nbsp;<b>${Math.abs(latD).toFixed(3)}° ${latD>=0?'N':'S'}</b><br>LON &nbsp;<b>${Math.abs(lonD).toFixed(3)}° ${lonD>=0?'E':'W'}</b><br>ELEV &nbsp;<b>${em} m</b><br>`+
        `<span class="sep">─────────────────</span><br>MAX &nbsp;<b>${MAX_M} m</b><br>GRID &nbsp;${GW} × ${GH}`;
    }}
  renderer.render(scene,camera);
}animate();
</script>
