<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEOINT // Strategic Globe v7</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#131a17;--surface:rgba(20,30,26,.93);--border:rgba(190,207,184,.1);--border-h:rgba(190,207,184,.22);--accent:#8aad84;--accent2:#305852;--red:#c27066;--gold:#b89a4a;--green:#6b9e6f;--yellow:#e3c04a;--orange:#e0893a;--crim:#c0392b;--purple:#9b59b6;--rose:#c4a095;--text:#9aaa97;--text-dim:#5a6d5e;--white:#d5d8d2;--bright:#e8ebe5;--mono:'IBM Plex Mono',monospace;--sans:'Barlow',sans-serif;--cond:'Barlow Condensed',sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono)}
canvas#gl{position:fixed;inset:0;z-index:1}
#top{position:fixed;top:0;left:0;right:0;height:40px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(180deg,rgba(19,26,23,.97),rgba(19,26,23,.4));border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.logo{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
#clock{font-size:10px;color:var(--text-dim);letter-spacing:1.5px}
#bot{position:fixed;bottom:0;left:0;right:0;height:34px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(0deg,rgba(19,26,23,.97),rgba(19,26,23,.4));border-top:1px solid var(--border);font-size:9px;color:var(--text-dim);letter-spacing:1px}
#bot .left{display:flex;align-items:center;gap:14px}
#bot .right{display:flex;align-items:center;gap:14px}
#coords-box{display:flex;align-items:center;gap:10px;padding:5px 12px;background:rgba(138,173,132,.06);border:1px solid rgba(138,173,132,.18);border-radius:4px}
#coords-box .lbl{font-size:8px;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase}
#coords-box .val{font-family:var(--mono);font-size:11px;color:var(--bright);font-weight:500;letter-spacing:.5px;min-width:160px;text-align:right}
#coords-box .nm{font-family:var(--sans);font-size:11px;color:var(--accent);font-weight:600;border-right:1px solid var(--border);padding-right:10px;margin-right:2px}
#coords-box .nm:empty{display:none}
#tip{position:fixed;z-index:300;pointer-events:none;opacity:0;transition:opacity .15s;padding:10px 16px;background:var(--surface);border:1px solid var(--border-h);border-radius:4px;backdrop-filter:blur(14px)}
#tip.on{opacity:1}
#tip .n{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--bright)}
#tip .s{font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-top:2px}

#detail{position:fixed;top:44px;left:10px;bottom:34px;width:420px;z-index:100;display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;transform:translateX(-440px);transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .3s}
#detail.open{opacity:1;pointer-events:auto;transform:translateX(0)}
.pnl{background:var(--surface);border:1px solid var(--border);border-radius:6px;backdrop-filter:blur(14px);overflow:hidden}
.pnl-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.pnl-t{font-family:var(--cond);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.pnl-b{padding:12px 14px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.pnl-b::-webkit-scrollbar{width:4px}.pnl-b::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.c-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.c-flag{font-size:38px;line-height:1}
.c-name{font-family:var(--sans);font-size:18px;font-weight:600;color:var(--bright);cursor:text;border-bottom:1px dashed transparent}
.c-name:hover,.editable:hover{border-bottom:1px dashed var(--accent)}
.c-cap{font-size:11px;color:var(--text-dim);margin-top:2px}
.editable{cursor:text;outline:none;padding:0 2px;border-radius:2px}
.editable:focus{background:rgba(138,173,132,.12);border-bottom:1px solid var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.stat{padding:8px 10px;background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:4px}
.stat .sl{font-size:9px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.stat .sv{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--white)}
.sec{margin-bottom:12px}
.sec-t{font-family:var(--cond);font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sec p{font-size:11px;color:var(--text);line-height:1.6;margin-bottom:6px}
.sec ul{list-style:none;padding:0}.sec li{font-size:11px;color:var(--text);line-height:1.6;display:flex;align-items:center;gap:6px}
.sec li::before{content:'›';color:var(--accent)}
.sec li .del{margin-left:auto;cursor:pointer;color:var(--text-dim);font-size:10px}
.sec li .del:hover{color:var(--red)}
.eth-row{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.eth-name{font-size:10px;color:var(--text);min-width:100px}
.eth-track{flex:1;height:5px;background:rgba(255,255,255,.03);border-radius:3px;overflow:hidden}
.eth-fill{height:100%;border-radius:3px;background:var(--accent2)}
.eth-pct{font-size:9px;color:var(--text-dim);min-width:30px;text-align:right}
.eth-profile{margin:4px 0 8px;padding:8px;border-left:2px solid var(--accent2);background:rgba(48,88,82,.06);border-radius:0 4px 4px 0}
.eth-profile p{font-size:10px;color:var(--text);line-height:1.6;margin:0}
.terrain-bar{display:flex;height:14px;border-radius:3px;overflow:hidden;margin-bottom:6px}
.tb-p,.tb-h,.tb-m{display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff}
.tb-p{background:var(--green)}.tb-h{background:var(--gold)}.tb-m{background:#8b5a2b}
.topo-chart{margin:8px 0;padding:10px;background:rgba(0,0,0,.18);border-radius:4px;border:1px solid var(--border)}
.trade-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:4px 8px;background:rgba(255,255,255,.01);border-radius:3px}
.trade-name{flex:1;font-size:10px;color:var(--text)}
.trade-pct{font-size:11px;font-weight:500;color:var(--white);min-width:40px;text-align:right}
.trade-bar{width:60px;height:4px;background:rgba(255,255,255,.03);border-radius:2px;overflow:hidden}
.trade-fill{height:100%;border-radius:2px}.trade-fill.ex{background:var(--green)}.trade-fill.im{background:var(--rose)}
.marker-item{padding:7px 9px;border-radius:4px;background:rgba(255,255,255,.015);border:1px solid var(--border);margin-bottom:5px;transition:border-color .2s}
.marker-item:hover{border-color:var(--border-h)}
.mi-row{display:flex;align-items:center;gap:6px}
.mi-name{flex:1;font-size:11px;color:var(--white);cursor:pointer}
.mi-info{font-size:9px;color:var(--text-dim);margin-top:2px}
.mi-edit{font-size:9px;color:var(--accent);cursor:pointer;padding:2px 6px;border:1px solid var(--border);border-radius:2px;background:none;font-family:var(--mono)}
.mi-edit:hover{background:rgba(138,173,132,.1)}
.mi-del{font-size:10px;color:var(--text-dim);cursor:pointer;padding:2px 5px}
.mi-del:hover{color:var(--red)}
.mi-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
.mi-dot.ext{background:var(--gold)}.mi-dot.mil{background:var(--red)}.mi-dot.for{background:var(--rose)}
.mi-edit-form{margin-top:6px;padding:6px;background:rgba(0,0,0,.2);border-radius:3px;display:none}
.mi-edit-form.on{display:block}
.mi-edit-form input{width:100%;margin-bottom:4px;padding:4px 6px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:2px;color:var(--white);font-family:var(--mono);font-size:10px;outline:none}
.mi-edit-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.edit-btn{background:none;border:1px solid var(--border);border-radius:3px;color:var(--accent);font-size:9px;padding:3px 8px;cursor:pointer;font-family:var(--mono);letter-spacing:1px;transition:all .2s}
.edit-btn:hover{background:rgba(138,173,132,.1);border-color:var(--accent)}
.add-mini{font-size:9px;color:var(--accent);cursor:pointer;padding:2px 6px;border:1px dashed var(--border-h);border-radius:3px;background:none;font-family:var(--mono)}
.add-mini:hover{border-color:var(--accent);background:rgba(138,173,132,.08)}
.user-note{margin-top:8px;padding:10px;background:rgba(138,173,132,.04);border:1px solid rgba(138,173,132,.15);border-radius:4px}
.user-note-label{font-size:8px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.user-note p{font-size:11px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.note-editor{width:100%;min-height:80px;padding:8px;background:rgba(0,0,0,.2);border:1px solid var(--accent);border-radius:4px;color:var(--white);font-family:var(--mono);font-size:11px;resize:vertical;outline:none;margin-top:6px}
.note-save{margin-top:6px;padding:5px 12px;background:rgba(138,173,132,.15);border:1px solid var(--accent);border-radius:3px;color:var(--accent);font-family:var(--mono);font-size:10px;cursor:pointer;letter-spacing:1px}

#sidebar{position:fixed;top:44px;right:10px;bottom:34px;width:300px;z-index:100;display:flex;flex-direction:column;gap:6px;transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .3s;overflow:hidden}
#sidebar.off{transform:translateX(320px);opacity:0;pointer-events:none}
#sidebar .pnl{min-height:0}
.toggle-btn{position:fixed;z-index:101;width:32px;height:32px;border-radius:4px;background:var(--surface);border:1px solid var(--border);color:var(--accent);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
#btn-side{top:44px;right:10px}
#btn-detail{top:44px;left:10px;opacity:0;pointer-events:none;transition:opacity .3s}
#btn-detail.on{opacity:1;pointer-events:auto}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:8px 4px;text-align:center;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.terrain-legend{display:flex;gap:12px;font-size:9px;color:var(--text-dim)}
.terrain-legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.tl-p::before{background:var(--green)}.tl-h::before{background:var(--gold)}.tl-m::before{background:#8b5a2b}
#loader{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
#loader.done{opacity:0;pointer-events:none}
.load-bar{width:200px;height:2px;background:rgba(255,255,255,.05);border-radius:1px;overflow:hidden;margin-top:16px}
.load-fill{height:100%;background:var(--accent);width:0%;transition:width .3s}
.load-msg{font-size:11px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase}
.btn-add{width:100%;padding:7px;background:rgba(138,173,132,.08);border:1px solid rgba(138,173,132,.2);border-radius:3px;color:var(--accent);font-family:var(--mono);font-size:10px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.btn-add:hover{background:rgba(138,173,132,.15)}
#ev-form input,#ev-form select,#ev-form textarea{width:100%;padding:7px 9px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:3px;color:var(--white);font-family:var(--mono);font-size:10px;margin-bottom:5px;outline:none}
#ev-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#ev-form textarea{resize:none;height:44px}
.sev-row{display:flex;gap:6px;margin-bottom:6px}
.sev-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s}
.sev-dot.on{border-color:var(--white);transform:scale(1.15)}
.sev-dot[data-s="1"]{background:var(--green)}.sev-dot[data-s="2"]{background:var(--yellow)}.sev-dot[data-s="3"]{background:var(--orange)}.sev-dot[data-s="4"]{background:var(--crim)}.sev-dot[data-s="5"]{background:var(--purple)}
.ev-item{padding:8px 10px;border-radius:4px;background:rgba(255,255,255,.015);border:1px solid transparent;margin-bottom:5px;cursor:pointer;display:flex;align-items:flex-start;gap:8px}
.ev-item:hover{border-color:var(--border)}
.ev-item .sev{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.ev-item .t{flex:1;font-size:10px;color:var(--white);line-height:1.4}
.ev-item .x{color:var(--text-dim);font-size:10px;cursor:pointer}
.ev-item .x:hover{color:var(--red)}
.cpick{display:flex;align-items:center;gap:8px;padding:6px 0}
.cpick label{font-size:10px;color:var(--text-dim);flex:1}
.cpick input[type=color]{width:34px;height:26px;border:1px solid var(--border);border-radius:3px;background:none;cursor:pointer;-webkit-appearance:none}
.cpick input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.cpick input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}

/* Event card overlay */
#ev-card{position:fixed;z-index:250;width:260px;background:var(--surface);border:1px solid var(--purple);border-radius:6px;backdrop-filter:blur(14px);overflow:hidden;display:none;box-shadow:0 0 20px rgba(155,89,182,.3)}
#ev-card.on{display:block}
#ev-card img{width:100%;height:120px;object-fit:cover;display:block;background:rgba(0,0,0,.3)}
#ev-card .body{padding:10px 12px}
#ev-card .hd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#ev-card .sev{width:12px;height:12px;border-radius:50%;flex-shrink:0}
#ev-card .ti{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--bright);flex:1}
#ev-card .ds{font-size:10px;color:var(--text);line-height:1.5;margin-top:4px}
#ev-card .cl{position:absolute;top:6px;right:8px;cursor:pointer;color:var(--white);font-size:14px;background:rgba(0,0,0,.5);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
</style>
</head>
<body>
<div id="loader"><div class="load-msg">GEOINT v7 — RAISED GPU PICK</div><div class="load-bar"><div class="load-fill" id="lf"></div></div></div>
<canvas id="gl"></canvas>
<div id="top"><div class="logo"><span class="dot"></span>GEOINT // STRATEGIC GLOBE v7</div><div style="display:flex;align-items:center;gap:14px"><div id="search-wrap" style="position:relative"><input id="search-in" placeholder="🔍 Search country…" autocomplete="off" style="background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--white);font-family:var(--mono);font-size:10px;padding:5px 10px;border-radius:3px;width:180px;outline:none"><div id="search-res" style="display:none;position:absolute;top:30px;right:0;width:240px;max-height:280px;overflow-y:auto;background:var(--surface);border:1px solid var(--border-h);border-radius:4px;backdrop-filter:blur(14px);z-index:200"></div></div><button onclick="openGhSettings()" style="background:none;border:1px solid var(--border);color:var(--accent);font-family:var(--mono);font-size:9px;letter-spacing:1.5px;padding:4px 10px;border-radius:3px;cursor:pointer">⬢ GITHUB SYNC</button><div id="clock"></div></div></div>
<div id="tip"><div class="n" id="tt-n"></div><div class="s" id="tt-s"></div></div>
<button class="toggle-btn" id="btn-detail">✕</button>
<div id="detail">
  <div class="pnl" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
    <div class="pnl-h"><div class="pnl-t">Intelligence</div><button onclick="closeDetail()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px">✕</button></div>
    <div class="tabs" id="dtabs">
      <div class="tab active" data-tab="overview">Overview</div>
      <div class="tab" data-tab="geography">Geography</div>
      <div class="tab" data-tab="economy">Economy</div>
      <div class="tab" data-tab="strategic">Strategic</div>
    </div>
    <div class="pnl-b" style="flex:1" id="det-body"><div style="text-align:center;padding:40px 0;color:var(--text-dim);font-size:11px">Select a country</div></div>
  </div>
</div>
<button class="toggle-btn" id="btn-side">☰</button>
<div id="sidebar">
  <div class="pnl" style="flex:1 1 0;min-height:120px;display:flex;flex-direction:column">
    <div class="pnl-h"><div class="pnl-t">⬡ Events</div><span style="font-size:9px;color:var(--text-dim)" id="ev-count">0</span></div>
    <div class="pnl-b" id="ev-list" style="flex:1"><div style="text-align:center;padding:16px 0;color:var(--text-dim);font-size:10px">Add event ↓</div></div>
  </div>
  <div class="pnl" style="flex:0 0 auto">
    <div class="pnl-h"><div class="pnl-t">+ Event</div></div>
    <div id="ev-form" style="padding:10px 12px">
      <input type="text" id="ev-t" placeholder="Title...">
      <textarea id="ev-d" placeholder="Description..."></textarea>
      <div class="row2">
        <input type="number" step="0.01" id="ev-lat" placeholder="Lat">
        <input type="number" step="0.01" id="ev-lng" placeholder="Lng">
      </div>
      <div style="font-size:9px;color:var(--text-dim);margin:4px 0 4px;letter-spacing:1px">SEVERITY</div>
      <div class="sev-row" id="sev-row">
        <div class="sev-dot on" data-s="1" title="Notable"></div>
        <div class="sev-dot" data-s="2" title="Watch"></div>
        <div class="sev-dot" data-s="3" title="Crisis"></div>
        <div class="sev-dot" data-s="4" title="Severe"></div>
        <div class="sev-dot" data-s="5" title="Total risk"></div>
      </div>
      <input type="file" id="ev-img" accept="image/*" style="font-size:9px">
      <button class="btn-add" id="btn-ev">+ Add Event</button>
      <button class="btn-add" id="btn-ai" title="Requires backend/API key" style="opacity:.55;margin-top:4px">⚡ AI Daily (setup required)</button>
    </div>
  </div>
  <div class="pnl" style="flex:0 0 auto">
    <div class="pnl-h"><div class="pnl-t">◉ Color</div></div>
    <div class="pnl-b" id="cpanel"><div style="font-size:10px;color:var(--text-dim)">Select a country</div></div>
  </div>
</div>
<div id="ev-card"><div class="cl" id="ev-card-cl">✕</div><img id="ev-card-img" style="display:none"><div class="body"><div class="hd"><div class="sev" id="ev-card-sev"></div><div class="ti" id="ev-card-ti"></div></div><div class="ds" id="ev-card-ds"></div></div></div>
<svg id="ev-leader" style="position:fixed;inset:0;pointer-events:none;z-index:249;display:none"><line id="ev-leader-line" stroke="rgba(155,89,182,.7)" stroke-width="1.5" stroke-dasharray="4 3"/></svg>
<div id="bot"><div class="left">SYS NOMINAL // RAISED SELECTION // ANTIMERIDIAN FIX // EDIT MODE</div><div class="right"><div id="coords-box"><span class="nm" id="coords-nm"></span><span class="lbl">LAT/LNG</span><span class="val" id="coords">—</span></div></div></div>

<script src="flags.js"></script>
<script src="data.js"></script>
<script src="basics.js"></script>

<script src="ethnicities-americas.js"></script>
<script src="ethnicities-asia.js"></script>
<script src="ethnicities-europe-oceania.js"></script>
<script src="ethnicities-filler.js"></script>

<script>
(async()=>{
// ================= STORAGE =================
const LS={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

// ============ GEOMETRY HELPERS ============
// Unwrap a ring so consecutive vertices never jump by more than 180° of longitude.
// Turns a wrap-around ring into a continuous strip in (lng, lat) space.
function unwrapRing(ring){
  if(!ring.length)return ring;
  const out=[ring[0].slice()];
  for(let i=1;i<ring.length;i++){
    const prev=out[i-1];
    let lng=ring[i][0];
    while(lng-prev[0]>180)lng-=360;
    while(lng-prev[0]<-180)lng+=360;
    out.push([lng,ring[i][1]]);
  }
  return out;
}
function ringLngSpan(ring){let mn=Infinity,mx=-Infinity;for(const p of ring){if(p[0]<mn)mn=p[0];if(p[0]>mx)mx=p[0]}return mx-mn}
// If ring is a polar cap (unwrapped span ≥ ~340°), add pole corners.
function augmentPolarCap(ring){
  const span=ringLngSpan(ring);
  if(span<340)return ring;
  const avg=ring.reduce((s,p)=>s+p[1],0)/ring.length;
  const pole=avg<0?-90:90;
  const last=ring[ring.length-1];
  const first=ring[0];
  return [...ring,[last[0],pole],[first[0],pole]];
}

// Canvas drawing with antimeridian moveTo-split (NO geometry shifting).
function drawRingCanvas(c,ring,fill,stroke,lw){
  if(ring.length<2)return;
  // Polar cap: use augmented ring so fill reaches the pole
  let r=ring;
  const uw=unwrapRing(ring);
  if(ringLngSpan(uw)>=340)r=augmentPolarCap(uw);
  c.beginPath();
  let px=null;
  r.forEach((co,i)=>{
    const[x,y]=ll2px(co[0],co[1]);
    if(i===0)c.moveTo(x,y);
    else if(px!==null&&Math.abs(x-px)>W/2)c.moveTo(x,y);
    else c.lineTo(x,y);
    px=x;
  });
  c.closePath();
  if(fill){c.fillStyle=fill;c.fill()}
  if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||.5;c.stroke()}
}

function llv(lat,lng,r){const p=(90-lat)*Math.PI/180,t=(lng+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))}
// Inverse of llv: a 3D point in LOCAL globe space (after undoing rotation) → {lat,lng}
function vToLatLng(v){
  const r=v.length();
  const lat=90-(Math.acos(v.y/r)*180/Math.PI);
  const lng=(Math.atan2(v.z,-v.x)*180/Math.PI)-180;
  return {lat,lng:((lng+540)%360)-180};
}
// Raycast from screen pixel onto globe sphere; returns {lat,lng} or null if miss.
// Analytic ray-sphere intersection is faster and more reliable than instantiating a Three.js Mesh.
const _rcMouse=new THREE.Vector2(),_rcRay=new THREE.Raycaster();
function screenToLatLng(mx,my){
  _rcMouse.x=(mx/innerWidth)*2-1;
  _rcMouse.y=-(my/innerHeight)*2+1;
  _rcRay.setFromCamera(_rcMouse,cam);
  // Analytic ray-sphere intersection (sphere centered at origin, radius R)
  const o=_rcRay.ray.origin, d=_rcRay.ray.direction;
  // |o + t*d|² = R²  →  t² + 2(o·d)t + (|o|² - R²) = 0
  const b=2*(o.x*d.x+o.y*d.y+o.z*d.z);
  const c=o.x*o.x+o.y*o.y+o.z*o.z-R*R;
  const disc=b*b-4*c;
  if(disc<0)return null;
  const t=(-b-Math.sqrt(disc))/2; // near hit
  if(t<0)return null;
  // World-space hit point
  const hx=o.x+t*d.x, hy=o.y+t*d.y, hz=o.z+t*d.z;
  // Undo globeGroup rotation analytically (Rx · Ry · local = world  →  local = Ry⁻¹ · Rx⁻¹ · world)
  const rx=globeGroup.rotation.x, ry=globeGroup.rotation.y;
  // Inverse Rx (rotate by -rx around X): y' = cos(rx)*y + sin(rx)*z, z' = -sin(rx)*y + cos(rx)*z
  const cx=Math.cos(-rx), sx=Math.sin(-rx);
  const x1=hx, y1=cx*hy-sx*hz, z1=sx*hy+cx*hz;
  // Inverse Ry: x'' = cos(ry)*x - sin(ry)*z, z'' = sin(ry)*x + cos(ry)*z  (note: -ry → flip signs)
  const cy=Math.cos(-ry), sy=Math.sin(-ry);
  const x2=cy*x1+sy*z1, y2=y1, z2=-sy*x1+cy*z1;
  return vToLatLng({x:x2,y:y2,z:z2});
}

// ================= RAISED COUNTRY MESH (flat 2D cap curved on sphere) =================
let raisedMesh=null,raisedEdge=null;
function clearRaised(){while(raisedGrp.children.length)raisedGrp.remove(raisedGrp.children[0]);raisedMesh=null;raisedEdge=null}

// Densify a ring: insert points on segments longer than maxSeg (in degrees)
function densifyRing(ring,maxSeg){
  const out=[];
  for(let i=0;i<ring.length;i++){
    const a=ring[i],b=ring[(i+1)%ring.length];
    out.push(a);
    const d=Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]));
    if(d>maxSeg){
      const n=Math.ceil(d/maxSeg);
      for(let k=1;k<n;k++){const t=k/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
    }
  }
  return out;
}

// Subdivide triangles so mesh hugs sphere curvature. Splits edges longer than maxDeg.
function subdivideTris(V,T,maxDeg){
  for(let iter=0;iter<5;iter++){
    let changed=false;
    const newT=[];
    const midCache=new Map();
    const getMid=(i,j)=>{
      const k=i<j?i+'_'+j:j+'_'+i;
      if(midCache.has(k))return midCache.get(k);
      const a=V[i],b=V[j];
      const idx=V.length;V.push([(a[0]+b[0])/2,(a[1]+b[1])/2]);
      midCache.set(k,idx);return idx;
    };
    for(let i=0;i<T.length;i+=3){
      const i0=T[i],i1=T[i+1],i2=T[i+2];
      const a=V[i0],b=V[i1],c=V[i2];
      const e0=Math.hypot(a[0]-b[0],a[1]-b[1]);
      const e1=Math.hypot(b[0]-c[0],b[1]-c[1]);
      const e2=Math.hypot(c[0]-a[0],c[1]-a[1]);
      if(Math.max(e0,e1,e2)>maxDeg && V.length<60000){
        changed=true;
        const m01=getMid(i0,i1),m12=getMid(i1,i2),m20=getMid(i2,i0);
        newT.push(i0,m01,m20, m01,i1,m12, m20,m12,i2, m01,m12,m20);
      } else newT.push(i0,i1,i2);
    }
    T=newT;
    if(!changed)break;
  }
  return T;
}

function buildCountryMesh(id,color){
  clearRaised();
  const polys=countryPolys[id];if(!polys||!window.earcut)return;
  const RH=R*1.004;
  const positions=[],indices=[];
  const edgePositions=[];
  let vi=0;

  const pushRingMesh=(rawRing)=>{
    if(!rawRing||rawRing.length<3)return;
    // Step 1: unwrap for antimeridian continuity
    let ring=unwrapRing(rawRing);
    if(ringLngSpan(ring)>=340)ring=augmentPolarCap(ring);
    // Step 2: deduplicate consecutive identical points
    const dedup=[ring[0]];
    for(let i=1;i<ring.length;i++){
      const p=ring[i],prev=dedup[dedup.length-1];
      if(Math.abs(p[0]-prev[0])>1e-6||Math.abs(p[1]-prev[1])>1e-6)dedup.push(p);
    }
    if(dedup.length<3)return;
    // Step 3: earcut on RAW ring (no densification — earcut works in 2D)
    const flat=[];dedup.forEach(([lng,lat])=>flat.push(lng,lat));
    const rawTris=earcut(flat);
    if(!rawTris.length)return;
    // Step 4: build vertex array + subdivide large triangles for curvature
    let V=[];for(let i=0;i<flat.length;i+=2)V.push([flat[i],flat[i+1]]);
    let T=Array.from(rawTris);
    T=subdivideTris(V,T,3); // subdivide edges > 3°
    // Step 5: project all vertices to sphere
    const baseIdx=vi;
    V.forEach(([lng,lat])=>{const v=llv(lat,lng,RH);positions.push(v.x,v.y,v.z);vi++});
    for(let i=0;i<T.length;i++)indices.push(baseIdx+T[i]);
    // Step 6: edge outline (densified for smooth curve)
    const edgeRing=densifyRing(dedup,2);
    for(let i=0;i<edgeRing.length;i++){
      const i2=(i+1)%edgeRing.length;
      if(Math.abs(edgeRing[i][1])>89||Math.abs(edgeRing[i2][1])>89)continue;
      const a=llv(edgeRing[i][1],edgeRing[i][0],RH*1.001);
      const b=llv(edgeRing[i2][1],edgeRing[i2][0],RH*1.001);
      edgePositions.push(a.x,a.y,a.z,b.x,b.y,b.z);
    }
  };

  polys.forEach(poly=>{
    const outer=poly[0];
    if(!outer||outer.length<3)return;
    pushRingMesh(outer);
  });

  if(!positions.length)return;
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mat=new THREE.MeshBasicMaterial({color:color||0x5fa888,transparent:true,opacity:.72,side:THREE.DoubleSide,depthWrite:false});
  raisedMesh=new THREE.Mesh(geo,mat);
  raisedGrp.add(raisedMesh);
  const eg=new THREE.BufferGeometry();
  eg.setAttribute('position',new THREE.Float32BufferAttribute(edgePositions,3));
  raisedEdge=new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0xd5e8d0,transparent:true,opacity:.95}));
  raisedGrp.add(raisedEdge);
}

let drag=false,pm={x:0,y:0},cpm={x:0,y:0},rvx=0,rvy=0,autoR=true,tZoom=4.8;
let selectedId=null,hoveredId=null,activeTab='overview';

canvas.addEventListener('mousedown',e=>{drag=true;pm=cpm={x:e.clientX,y:e.clientY};autoR=false});
canvas.addEventListener('mousemove',e=>{
  if(drag){
    const dx=e.clientX-pm.x,dy=e.clientY-pm.y;
    rvx=dx*.003;rvy=dy*.003;
    globeGroup.rotation.y+=dx*.005;
    globeGroup.rotation.x=Math.max(-Math.PI/2,Math.min(Math.PI/2,globeGroup.rotation.x+dy*.005));
    pm={x:e.clientX,y:e.clientY};
    return;
  }
  const id=gpuPick(e.clientX,e.clientY);
  const tt=document.getElementById('tip');
  const nm=id?countryName(id):null;
  const ll=screenToLatLng(e.clientX,e.clientY);
  const coordsTxt=ll?`${ll.lat.toFixed(2)}°, ${ll.lng.toFixed(2)}°`:'—';
  document.getElementById('coords').textContent=coordsTxt;
  document.getElementById('coords-nm').textContent=nm||'';
  if(id&&nm){
    const d=COUNTRY_DB[id];
    tt.classList.add('on');
    tt.style.left=(e.clientX+14)+'px';
    tt.style.top=(e.clientY-8)+'px';
    document.getElementById('tt-n').textContent=countryFlag(id)+' '+nm;
    document.getElementById('tt-s').textContent=d?`POP ${fN(d.population)} · GDP $${d.gdp||'—'}B`:'';
    canvas.style.cursor='pointer';
    hoveredId=id;
  }else{
    tt.classList.remove('on');
    canvas.style.cursor='grab';
    hoveredId=null;
  }
});
canvas.addEventListener('mouseup',()=>drag=false);
canvas.addEventListener('wheel',e=>{tZoom=Math.max(2,Math.min(10,tZoom+e.deltaY*.005));e.preventDefault()},{passive:false});
canvas.addEventListener('click',e=>{
  if(Math.abs(e.clientX-cpm.x)>5||Math.abs(e.clientY-cpm.y)>5)return;
  // Check event marker click first (raycast)
  const mouse=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  const rc=new THREE.Raycaster();
  rc.setFromCamera(mouse,cam);
  const hits=rc.intersectObjects(eventGrp.children,false);
  const evHit=hits.find(h=>h.object.userData.eventIdx!==undefined);
  if(evHit){
    const evIdx=evHit.object.userData.eventIdx;
    const ev=events[evIdx];
    if(ev&&typeof ev.lat==='number')focusLL(ev.lat,ev.lng,3.2);
    showEventCard(evIdx);
    return;
  }
  selectCountry(gpuPick(e.clientX,e.clientY));
});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// 3D Cartesian centroid: avoids antimeridian wraparound issues. Cached.
const _centroidCache={};
function countryCentroid(id){
  if(_centroidCache[id])return _centroidCache[id];
  const polys=countryPolys[id];if(!polys||!polys.length)return null;
  let sx=0,sy=0,sz=0,n=0;
  polys.forEach(poly=>{
    const ring=poly[0];if(!ring)return;
    ring.forEach(([lng,lat])=>{
      const v=llv(lat,lng,1);
      sx+=v.x;sy+=v.y;sz+=v.z;n++;
    });
  });
  if(!n)return null;
  const len=Math.sqrt(sx*sx+sy*sy+sz*sz);
  if(len<1e-9)return null;
  const ll=vToLatLng({x:sx/len,y:sy/len,z:sz/len});
  _centroidCache[id]=ll;
  return ll;
}

// Camera distance from area: small countries → close, huge → far. Tuned for visual balance.
function zoomForArea(area){
  if(!area||area<1)return 2.6;
  if(area<5000)return 2.6;       // city-states, atolls
  if(area<50000)return 2.9;      // small (Belgium, Switzerland)
  if(area<300000)return 3.3;     // medium (Italy, UK, Germany)
  if(area<1500000)return 3.8;    // large (Iran, Mexico, Mongolia)
  if(area<5000000)return 4.4;    // huge (India, Argentina)
  return 5.2;                     // continental (Russia, Canada, China, USA)
}

function selectCountry(id){
  clearOverlay();
  clearRaised();
  if(selectedId){redrawCountry(selectedId)}
  selectedId=id;
  if(!selectedId){closeDetail();document.getElementById('cpanel').innerHTML='<div style="font-size:10px;color:var(--text-dim)">Select a country</div>';return}
  drawCountry(selectedId,countryColors[selectedId]||'#305852','#7ba890',2);
  visTex.needsUpdate=true;
  const clrHex=countryColors[selectedId]?parseInt(countryColors[selectedId].slice(1),16):0x4a8270;
  buildCountryMesh(selectedId,clrHex);
  showDetail(selectedId);
  showCP(selectedId);
  const d=COUNTRY_DB[id];
  if(d&&d.extraction)d.extraction.forEach(ex=>addOverlayDot(ex.lat,ex.lng,0xb89a4a));
  if(d&&d.bases)d.bases.forEach(b=>addOverlayDot(b.lat,b.lng,b.f?0xc4a095:0xc27066));
  // Auto-focus camera on country centroid + area-based zoom
  const ct=countryCentroid(id);
  const zoom=zoomForArea(d&&d.area);
  if(ct)focusLL(ct.lat,ct.lng,zoom);
}

window.focusLL=function(lat,lng,targetZoom){
  // Goal: rotate globeGroup so that llv(lat,lng,1) ends up at (0,0,1) world space.
  // Three.js Y rotation matrix: x'=cos(θ)*x+sin(θ)*z, y'=y, z'=-sin(θ)*x+cos(θ)*z
  // After Ry: x'=0  →  cos(ty)*v0.x+sin(ty)*v0.z=0  →  ty=atan2(-v0.x, v0.z)
  // After Rx: y''=0  →  tx=atan2(v0.y, z') where z'=-sin(ty)*v0.x+cos(ty)*v0.z
  const v0=llv(lat,lng,1);
  const ty=Math.atan2(-v0.x,v0.z);
  const newZ=-Math.sin(ty)*v0.x+Math.cos(ty)*v0.z;  // FIX: was +sin, should be -sin
  const tx=Math.atan2(v0.y,newZ);
  const sx=globeGroup.rotation.x,sy=globeGroup.rotation.y;
  // shortest-arc on Y
  let symod=sy;
  while(ty-symod>Math.PI)symod+=2*Math.PI;
  while(ty-symod<-Math.PI)symod-=2*Math.PI;
  const sZoom=tZoom;
  const eZoom=(typeof targetZoom==='number')?targetZoom:tZoom;
  let t=0;autoR=false;
  (function step(){
    t+=1/60;
    if(t>1.2){globeGroup.rotation.x=tx;globeGroup.rotation.y=ty;tZoom=eZoom;return}
    const p=1-Math.pow(1-t/1.2,3);
    globeGroup.rotation.x=sx+(tx-sx)*p;
    globeGroup.rotation.y=symod+(ty-symod)*p;
    tZoom=sZoom+(eZoom-sZoom)*p;
    requestAnimationFrame(step);
  })();
};

// ================= DETAIL PANEL =================
function showDetail(id){
  document.getElementById('detail').classList.add('open');
  document.getElementById('btn-detail').classList.add('on');
  // Keep current activeTab — only default to overview the first time
  if(!activeTab)activeTab='overview';
  setTabs();renderTab(id);
}
window.closeDetail=function(){
  document.getElementById('detail').classList.remove('open');
  document.getElementById('btn-detail').classList.remove('on');
  clearOverlay();
  clearRaised();
  if(selectedId){redrawCountry(selectedId);selectedId=null}
};
document.querySelectorAll('#dtabs .tab').forEach(t=>t.addEventListener('click',()=>{activeTab=t.dataset.tab;setTabs();if(selectedId)renderTab(selectedId)}));
function setTabs(){document.querySelectorAll('#dtabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===activeTab))}

// Universal inline editor: any element with contenteditable onblur triggers save
window.editField=function(id,key,numeric){
  return `contenteditable="true" class="editable" onblur="saveField('${id}','${key}',${numeric?'true':'false'},this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"`;
};
window.saveField=function(id,key,numeric,el){
  let v=el.textContent.trim();
  if(numeric){v=parseFloat(v.replace(/[,$\s]/g,''));if(isNaN(v))v=null}
  if(!COUNTRY_DB[id])COUNTRY_DB[id]={};
  COUNTRY_DB[id][key]=v;
  saveDBOverride(id,key,v);
  renderTab(id);
};

function renderTab(id){
  const d=COUNTRY_DB[id]||{};
  const b=document.getElementById('det-body');
  const nm=countryName(id);
  if(activeTab==='overview')b.innerHTML=rOverview(d,id,nm);
  else if(activeTab==='geography')b.innerHTML=rGeo(d,id);
  else if(activeTab==='economy')b.innerHTML=rEcon(d,id);
  else b.innerHTML=rStrat(d,id);
}

function rOverview(d,id,nm){
  const flag=countryFlag(id);
  let h=`<div class="c-head"><div class="c-flag">${flag}</div><div><div class="c-name" ${editField(id,'name',false)}>${nm}</div><div class="c-cap">Capital: <span ${editField(id,'capital',false)}>${d.capital||'—'}</span></div></div></div>`;
  h+=`<div class="stats">
    <div class="stat"><div class="sl">Population</div><div class="sv" ${editField(id,'population',true)}>${fN(d.population)}</div></div>
    <div class="stat"><div class="sl">Area km²</div><div class="sv" ${editField(id,'area',true)}>${fN(d.area)}</div></div>
    <div class="stat"><div class="sl">GDP (B USD)</div><div class="sv">$<span ${editField(id,'gdp',true)}>${d.gdp||'—'}</span></div></div>
    <div class="stat"><div class="sl">GDP/Capita</div><div class="sv">$<span ${editField(id,'gdpPC',true)}>${d.gdpPC?fN(d.gdpPC):'—'}</span></div></div>
  </div>`;
  // Always render Ethnic Composition section, even if empty
  h+=`<div class="sec"><div class="sec-t">Ethnic Composition <button class="add-mini" onclick="addEthnicity('${id}')">+ add</button></div>`;
  const eths=d.ethnicities||[];
  if(eths.length===0){
    h+='<div style="font-size:10px;color:var(--text-dim);font-style:italic;padding:4px 0">No data — click + add</div>';
  } else {
    eths.forEach((e,i)=>{
      h+=`<div class="eth-row">
        <span class="eth-name" contenteditable="true" onblur="saveEthName('${id}',${i},this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${escapeHTML(e.n)}</span>
        <div class="eth-track"><div class="eth-fill" style="width:${e.p}%"></div></div>
        <span class="eth-pct" contenteditable="true" onblur="saveEthPct('${id}',${i},this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${e.p}%</span>
        <span class="mi-del" onclick="delEthnicity('${id}',${i})" style="margin-left:6px;cursor:pointer;color:var(--text-dim);font-size:11px">✕</span>
      </div>`;
      if(d.ethProfiles&&d.ethProfiles[e.n]){
        h+=`<div class="eth-profile"><p contenteditable="true" onblur="saveEthProfile('${id}','${escapeHTML(e.n)}',this)">${escapeHTML(d.ethProfiles[e.n])}</p></div>`;
      } else {
        h+=`<div class="eth-profile"><p contenteditable="true" onblur="saveEthProfile('${id}','${escapeHTML(e.n)}',this)" style="color:var(--text-dim);font-style:italic">Click to add description…</p></div>`;
      }
    });
  }
  h+='</div>';
  if(d.culture)h+=`<div class="sec"><div class="sec-t">Cultural Profile</div><p ${editField(id,'culture',false)}>${d.culture}</p></div>`;
  else h+=`<div class="sec"><div class="sec-t">Cultural Profile</div><p ${editField(id,'culture',false)} style="color:var(--text-dim);font-style:italic">Click to add…</p></div>`;
  h+=noteHTML(id,'overview','Overview Notes');
  return h;
}

function rGeo(d,id){
  let h='';
  // Topographic map (always present, async-loaded)
  h+=`<div class="sec"><div class="sec-t">Topographic Map <span style="font-size:8px;color:var(--text-dim);text-transform:none;letter-spacing:1px">· DEM contours</span></div><div id="topo-host-${id}" class="topo-chart" style="padding:0;overflow:hidden;border:1px solid var(--border);background:#0a1813;min-height:170px;position:relative"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:10px;letter-spacing:1px">⏳ FETCHING ELEVATION DATA…</div></div></div>`;
  // Trigger async fetch & inject after the panel renders
  setTimeout(()=>loadTopoFor(id),50);
  if(d.terrain){
    const t=d.terrain;
    h+=`<div class="sec"><div class="sec-t">Terrain</div><div class="terrain-bar"><div class="tb-p" style="width:${t.plains}%">${t.plains}%</div><div class="tb-h" style="width:${t.hills}%">${t.hills}%</div><div class="tb-m" style="width:${t.mountains}%">${t.mountains}%</div></div><div class="terrain-legend"><span class="tl-p">Plains</span><span class="tl-h">Hills</span><span class="tl-m">Mountains</span></div></div>`;
  }
  if(d.peaks&&d.peaks.length){
    const mx=Math.max(...d.peaks.map(p=>p.h));
    const cw=380,ch=170,pad=30;
    h+=`<div class="sec"><div class="sec-t">Elevation Profile</div><div class="topo-chart"><svg width="100%" viewBox="0 0 ${cw} ${ch+50}" preserveAspectRatio="xMidYMid meet">`;
    const gap=cw/(d.peaks.length+1);
    d.peaks.forEach((p,i)=>{
      const x=gap*(i+1);
      const bh=Math.max(14,(p.h/mx)*(ch-pad));
      const y=ch-bh+pad;
      h+=`<rect x="${x-18}" y="${y}" width="36" height="${bh}" fill="#7a5a34" rx="2"/>`;
      h+=`<text x="${x}" y="${y-6}" text-anchor="middle" fill="#e8d8b8" font-size="11" font-family="IBM Plex Mono" font-weight="600">${p.h}m</text>`;
      h+=`<text x="${x}" y="${ch+pad+18}" text-anchor="middle" fill="#9aaa97" font-size="9" font-family="IBM Plex Mono">${p.n}</text>`;
    });
    h+=`<line x1="0" y1="${ch+pad}" x2="${cw}" y2="${ch+pad}" stroke="#3a5a4a" stroke-width="1"/>`;
    h+='</svg></div></div>';
  }
  if(d.mountains)h+=`<div class="sec"><div class="sec-t">Mountains</div><ul>${d.mountains.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
  if(d.plains)h+=`<div class="sec"><div class="sec-t">Plains</div><ul>${d.plains.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
  if(d.rivers)h+=`<div class="sec"><div class="sec-t">Rivers</div><ul>${d.rivers.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
  if(d.lakes)h+=`<div class="sec"><div class="sec-t">Lakes</div><ul>${d.lakes.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
  h+=noteHTML(id,'geography','Geography Notes');
  return h||noteHTML(id,'geography','Geography Notes');
}

function rEcon(d,id){
  let h=`<div class="stats"><div class="stat"><div class="sl">GDP (B)</div><div class="sv">$<span ${editField(id,'gdp',true)}>${d.gdp||'—'}</span></div></div><div class="stat"><div class="sl">GDP/Cap</div><div class="sv">$<span ${editField(id,'gdpPC',true)}>${d.gdpPC?fN(d.gdpPC):'—'}</span></div></div></div>`;
  if(d.exports&&d.exports.length){
    h+='<div class="sec"><div class="sec-t">Top Exports</div>';
    d.exports.forEach(e=>{const o=typeof e==='string'?{n:e}:e;h+=`<div class="trade-row"><span class="trade-name">${o.n}</span>${o.p?`<div class="trade-bar"><div class="trade-fill ex" style="width:${Math.min(o.p*1.5,100)}%"></div></div><span class="trade-pct">${o.p}%</span>`:''}</div>`});
    h+='</div>';
  }
  if(d.imports&&d.imports.length){
    h+='<div class="sec"><div class="sec-t">Top Imports</div>';
    d.imports.forEach(e=>{const o=typeof e==='string'?{n:e}:e;h+=`<div class="trade-row"><span class="trade-name">${o.n}</span>${o.p?`<div class="trade-bar"><div class="trade-fill im" style="width:${Math.min(o.p*1.5,100)}%"></div></div><span class="trade-pct">${o.p}%</span>`:''}</div>`});
    h+='</div>';
  }
  h+=`<div class="sec"><div class="sec-t">Extraction Sites <button class="add-mini" onclick="addMarker('${id}','extraction')">+ add</button></div>`;
  if(d.extraction&&d.extraction.length){
    d.extraction.forEach((e,i)=>{h+=markerHTML(id,'extraction',i,e,'ext')});
  }
  h+='</div>';
  h+=noteHTML(id,'economy','Economic Notes');
  return h;
}

function rStrat(d,id){
  let h='';
  h+=`<div class="sec"><div class="sec-t">Strategic Sites <button class="add-mini" onclick="addMarker('${id}','bases')">+ add</button></div>`;
  if(d.bases&&d.bases.length){
    d.bases.forEach((e,i)=>{h+=markerHTML(id,'bases',i,e,e.f?'for':'mil')});
  }
  h+='</div>';
  h+=noteHTML(id,'strategic','Strategic Notes');
  return h;
}

function markerHTML(id,key,idx,e,cls){
  const isExt=key==='extraction';
  return `<div class="marker-item">
    <div class="mi-row">
      <span class="mi-dot ${cls}"></span>
      <div class="mi-name" onclick="focusLL(${e.lat},${e.lng},3.0)">${escapeHTML(e.n||'—')}</div>
      <button class="mi-edit" onclick="toggleMarkerEdit(this)">✎</button>
      <span class="mi-del" onclick="delMarker('${id}','${key}',${idx})">✕</span>
    </div>
    <div class="mi-info">${escapeHTML(isExt?(e.r||''):(e.t||''))}${!isExt&&e.f?' (foreign)':''}</div>
    <div class="mi-edit-form">
      <input placeholder="Name" value="${escapeHTML(e.n||'')}" data-k="n">
      <input placeholder="${isExt?'Resource':'Type'}" value="${escapeHTML(isExt?(e.r||''):(e.t||''))}" data-k="${isExt?'r':'t'}">
      <div class="row2"><input type="number" step="0.01" placeholder="Lat" value="${e.lat||''}" data-k="lat"><input type="number" step="0.01" placeholder="Lng" value="${e.lng||''}" data-k="lng"></div>
      ${!isExt?`<label style="font-size:9px;color:var(--text-dim)"><input type="checkbox" ${e.f?'checked':''} data-k="f" style="margin-right:4px;vertical-align:middle"> Foreign deployment</label>`:''}
      <button class="btn-add" onclick="saveMarker('${id}','${key}',${idx},this)">Save</button>
    </div>
  </div>`;
}

window.toggleMarkerEdit=function(btn){btn.closest('.marker-item').querySelector('.mi-edit-form').classList.toggle('on')};
window.addMarker=function(id,key){
  if(!COUNTRY_DB[id])COUNTRY_DB[id]={};
  if(!COUNTRY_DB[id][key])COUNTRY_DB[id][key]=[];
  const tmpl=key==='extraction'?{n:'New site',lat:0,lng:0,r:'Resource'}:{n:'New base',lat:0,lng:0,t:'Type',f:0};
  COUNTRY_DB[id][key].push(tmpl);
  saveDBOverride(id,key,COUNTRY_DB[id][key]);
  renderTab(id);
};
window.delMarker=function(id,key,idx){
  if(!COUNTRY_DB[id]||!COUNTRY_DB[id][key])return;
  COUNTRY_DB[id][key].splice(idx,1);
  saveDBOverride(id,key,COUNTRY_DB[id][key]);
  renderTab(id);
  // refresh overlay dots
  clearOverlay();
  const d=COUNTRY_DB[id];
  if(d.extraction)d.extraction.forEach(ex=>addOverlayDot(ex.lat,ex.lng,0xb89a4a));
  if(d.bases)d.bases.forEach(b=>addOverlayDot(b.lat,b.lng,b.f?0xc4a095:0xc27066));
};
window.saveMarker=function(id,key,idx,btn){
  const form=btn.closest('.mi-edit-form');
  const cur=COUNTRY_DB[id][key][idx];
  form.querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k;
    if(el.type==='number')cur[k]=parseFloat(el.value)||0;
    else if(el.type==='checkbox')cur[k]=el.checked?1:0;
    else cur[k]=el.value;
  });
  saveDBOverride(id,key,COUNTRY_DB[id][key]);
  renderTab(id);
  clearOverlay();
  const d=COUNTRY_DB[id];
  if(d.extraction)d.extraction.forEach(ex=>addOverlayDot(ex.lat,ex.lng,0xb89a4a));
  if(d.bases)d.bases.forEach(b=>addOverlayDot(b.lat,b.lng,b.f?0xc4a095:0xc27066));
};

// ============ ETHNICITY EDITING ============
function ensureEthArray(id){
  if(!COUNTRY_DB[id])COUNTRY_DB[id]={};
  if(!Array.isArray(COUNTRY_DB[id].ethnicities))COUNTRY_DB[id].ethnicities=[];
  return COUNTRY_DB[id].ethnicities;
}
window.addEthnicity=function(id){
  const arr=ensureEthArray(id);
  arr.push({n:'New group',p:0});
  saveDBOverride(id,'ethnicities',arr);
  renderTab(id);
};
window.delEthnicity=function(id,idx){
  const arr=ensureEthArray(id);
  const removed=arr[idx];
  arr.splice(idx,1);
  saveDBOverride(id,'ethnicities',arr);
  // Also remove its profile if any
  if(removed&&COUNTRY_DB[id].ethProfiles&&COUNTRY_DB[id].ethProfiles[removed.n]){
    delete COUNTRY_DB[id].ethProfiles[removed.n];
    saveDBOverride(id,'ethProfiles',COUNTRY_DB[id].ethProfiles);
  }
  renderTab(id);
};
window.saveEthName=function(id,idx,el){
  const arr=ensureEthArray(id);
  const oldName=arr[idx].n;
  const newName=el.textContent.trim()||'Unnamed';
  if(newName===oldName)return;
  arr[idx].n=newName;
  // Migrate profile key if exists
  if(COUNTRY_DB[id].ethProfiles&&COUNTRY_DB[id].ethProfiles[oldName]){
    COUNTRY_DB[id].ethProfiles[newName]=COUNTRY_DB[id].ethProfiles[oldName];
    delete COUNTRY_DB[id].ethProfiles[oldName];
    saveDBOverride(id,'ethProfiles',COUNTRY_DB[id].ethProfiles);
  }
  saveDBOverride(id,'ethnicities',arr);
  renderTab(id);
};
window.saveEthPct=function(id,idx,el){
  const arr=ensureEthArray(id);
  let v=parseFloat(el.textContent.replace(/[^\d.]/g,''));
  if(isNaN(v))v=0;
  v=Math.max(0,Math.min(100,v));
  arr[idx].p=v;
  saveDBOverride(id,'ethnicities',arr);
  renderTab(id);
};
window.saveEthProfile=function(id,name,el){
  if(!COUNTRY_DB[id])COUNTRY_DB[id]={};
  if(!COUNTRY_DB[id].ethProfiles)COUNTRY_DB[id].ethProfiles={};
  const txt=el.textContent.trim();
  if(txt&&txt!=='Click to add description…'){
    COUNTRY_DB[id].ethProfiles[name]=txt;
  } else {
    delete COUNTRY_DB[id].ethProfiles[name];
  }

window.pushToGitHub=async function(){
  const c=ghCfg();
  const st=document.getElementById('gh-status');
  if(!c.token||!c.owner||!c.repo){st.textContent='✗ Missing token/owner/repo';st.style.color='var(--red)';return}
  st.style.color='var(--text-dim)';
  st.textContent='⏳ Fetching current file SHA…';
  const apiUrl=`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}?ref=${c.branch}`;
  try{
    // Step 1: get current SHA (required for update)
    let sha=null;
    const head=await fetch(apiUrl,{headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}});
    if(head.status===200){const j=await head.json();sha=j.sha}
    else if(head.status!==404){const t=await head.text();throw new Error('GET failed: '+head.status+' '+t.slice(0,200))}
    // Step 2: build new content + base64
    const newContent=buildDataJS();
    // UTF-8 safe base64
    const b64=btoa(unescape(encodeURIComponent(newContent)));
    st.textContent='⏳ Pushing commit…';
    const body={
      message:'GEOINT data update '+new Date().toISOString().slice(0,19),
      content:b64,
      branch:c.branch
    };
    if(sha)body.sha=sha;
    const put=await fetch(apiUrl,{
      method:'PUT',
      headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(put.status>=200&&put.status<300){
      const j=await put.json();
      st.style.color='var(--green)';
      st.innerHTML='✓ Pushed! <a href="'+j.commit.html_url+'" target="_blank" style="color:var(--accent)">View commit</a>';
    } else {
      const t=await put.text();
      throw new Error('PUT failed: '+put.status+' '+t.slice(0,300));
    }
  }catch(err){
    st.style.color='var(--red)';
    st.textContent='✗ '+err.message;
  }
};

function showEventCard(idx){
  const e=events[idx];if(!e)return;

// Project a lat/lng on the globe to screen pixel coords; returns null if back-facing
function latLngToScreen(lat,lng){
  const v=llv(lat,lng,R*1.025);
  v.applyMatrix4(globeGroup.matrixWorld);
  // back-face cull: vector from camera to point dot point-from-center
  const camDir=v.clone().sub(cam.position);
  if(v.clone().normalize().dot(camDir.normalize())>0)return null;
  const proj=v.clone().project(cam);
  return {x:(proj.x+1)*innerWidth/2,y:(-proj.y+1)*innerHeight/2};
}
function updateEvCardPosition(){
  if(!evCardAnchor){evLeader.style.display='none';return}
  const sp=latLngToScreen(evCardAnchor.lat,evCardAnchor.lng);
  if(!sp){evLeader.style.display='none';evCard.style.opacity='0.3';return}
  evCard.style.opacity='1';
  evLeader.style.display='block';
  // Card position: offset above-right by default, flip if near edges
  const cardW=260,cardH=evCard.offsetHeight||180;
  let cx=sp.x+40,cy=sp.y-cardH-30;
  if(cx+cardW>innerWidth-10)cx=sp.x-cardW-40;
  if(cy<50)cy=sp.y+30;
  if(cy+cardH>innerHeight-40)cy=innerHeight-cardH-40;
  cx=Math.max(10,cx);
  evCard.style.left=cx+'px';
  evCard.style.top=cy+'px';
  // Leader line: from anchor (sp) to nearest corner of card
  const cardCx=cx+cardW/2, cardCy=cy+cardH/2;
  // Pick the card edge midpoint nearest to sp
  const candidates=[
    {x:cx+cardW/2,y:cy},          // top
    {x:cx+cardW/2,y:cy+cardH},    // bottom
    {x:cx,y:cy+cardH/2},          // left
    {x:cx+cardW,y:cy+cardH/2}     // right
  ];
  let best=candidates[0],bd=Infinity;
  candidates.forEach(c=>{const d=Math.hypot(c.x-sp.x,c.y-sp.y);if(d<bd){bd=d;best=c}});
  evLeaderLine.setAttribute('x1',sp.x);
  evLeaderLine.setAttribute('y1',sp.y);
  evLeaderLine.setAttribute('x2',best.x);
  evLeaderLine.setAttribute('y2',best.y);
}

const searchIn=document.getElementById('search-in');
const searchRes=document.getElementById('search-res');
function searchCountries(q){
  q=q.toLowerCase().trim();
  if(!q)return[];
  const out=[];
  Object.keys(countryPolys).forEach(id=>{
    const nm=countryName(id);
    if(nm&&nm.toLowerCase().includes(q))out.push({id,nm});
  });
  out.sort((a,b)=>{
    const ai=a.nm.toLowerCase().indexOf(q),bi=b.nm.toLowerCase().indexOf(q);
    if(ai!==bi)return ai-bi;
    return a.nm.localeCompare(b.nm);
  });
  return out.slice(0,20);
}
searchIn.addEventListener('input',()=>{
  const q=searchIn.value;
  const r=searchCountries(q);
  if(!r.length){searchRes.style.display='none';return}
  searchRes.innerHTML=r.map(x=>`<div class="search-item" data-id="${x.id}" style="padding:7px 12px;cursor:pointer;font-size:11px;color:var(--white);border-bottom:1px solid var(--border)">${countryFlag(x.id)} ${escapeHTML(x.nm)}</div>`).join('');
  searchRes.style.display='block';
});
searchIn.addEventListener('focus',()=>{if(searchIn.value)searchRes.style.display='block'});
searchIn.addEventListener('blur',()=>setTimeout(()=>searchRes.style.display='none',150));
searchRes.addEventListener('mousedown',e=>{
  const it=e.target.closest('.search-item');
  if(!it)return;
  const id=it.dataset.id;
  searchIn.value='';
  searchRes.style.display='none';
  searchIn.blur();
  selectCountry(id);
});
searchIn.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const r=searchCountries(searchIn.value);
    if(r.length){
      searchIn.value='';
      searchRes.style.display='none';
      searchIn.blur();
      selectCountry(r[0].id);
    }
  } else if(e.key==='Escape'){
    searchIn.value='';
    searchRes.style.display='none';
    searchIn.blur();
  }
});
