<!DOCTYPE html>
<html lang="en">
<head>

<title>GEOINT // Strategic Globe v6</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#131a17;--surface:rgba(20,30,26,.93);--border:rgba(190,207,184,.1);--border-h:rgba(190,207,184,.2);--accent:#8aad84;--accent2:#305852;--red:#c27066;--gold:#b89a4a;--green:#6b9e6f;--rose:#c4a095;--text:#9aaa97;--text-dim:#5a6d5e;--white:#d5d8d2;--bright:#e8ebe5;--mono:'IBM Plex Mono',monospace;--sans:'Barlow',sans-serif;--cond:'Barlow Condensed',sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--mono)}
canvas#gl{position:fixed;inset:0;z-index:1}
#top{position:fixed;top:0;left:0;right:0;height:40px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(180deg,rgba(19,26,23,.97),rgba(19,26,23,.4));border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.logo{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
#clock{font-size:10px;color:var(--text-dim);letter-spacing:1.5px}
#bot{position:fixed;bottom:0;left:0;right:0;height:28px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(0deg,rgba(19,26,23,.97),rgba(19,26,23,.4));border-top:1px solid var(--border);font-size:9px;color:var(--text-dim);letter-spacing:1px}
#tip{position:fixed;z-index:300;pointer-events:none;opacity:0;transition:opacity .2s;padding:10px 16px;background:var(--surface);border:1px solid var(--border-h);border-radius:4px;backdrop-filter:blur(14px)}
#tip.on{opacity:1}
#tip .n{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--bright)}
#tip .s{font-size:9px;color:var(--text-dim);letter-spacing:1px;margin-top:2px}
#detail{position:fixed;top:44px;left:10px;bottom:34px;width:400px;z-index:100;display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;transform:translateX(-420px);transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .3s}
#detail.open{opacity:1;pointer-events:auto;transform:translateX(0)}
.pnl{background:var(--surface);border:1px solid var(--border);border-radius:6px;backdrop-filter:blur(14px);overflow:hidden}
.pnl-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.pnl-t{font-family:var(--cond);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.pnl-b{padding:12px 14px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.pnl-b::-webkit-scrollbar{width:3px}.pnl-b::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.c-head{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.c-flag{font-size:38px;line-height:1}
.c-name{font-family:var(--sans);font-size:18px;font-weight:600;color:var(--bright);cursor:pointer;border-bottom:1px dashed transparent;transition:border-color .2s}
.c-name:hover{border-bottom-color:var(--accent)}
.c-cap{font-size:11px;color:var(--text-dim);margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.stat{padding:8px 10px;background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:4px}
.stat .sl{font-size:9px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.stat .sv{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--white)}
.sec{margin-bottom:10px}.sec-t{font-family:var(--cond);font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sec p{font-size:11px;color:var(--text);line-height:1.6;margin-bottom:6px}
.sec ul{list-style:none;padding:0}.sec li{font-size:11px;color:var(--text);line-height:1.6}.sec li::before{content:'›';color:var(--accent);margin-right:6px}
.eth-row{display:flex;align-items:center;gap:8px;margin-bottom:3px}.eth-name{font-size:10px;color:var(--text);min-width:100px}
.eth-track{flex:1;height:5px;background:rgba(255,255,255,.03);border-radius:3px;overflow:hidden}.eth-fill{height:100%;border-radius:3px;background:var(--accent2)}
.eth-pct{font-size:9px;color:var(--text-dim);min-width:30px;text-align:right}
.eth-profile{margin:4px 0 8px;padding:8px;border-left:2px solid var(--accent2);background:rgba(48,88,82,.06);border-radius:0 4px 4px 0}
.eth-profile p{font-size:10px;color:var(--text);line-height:1.6;margin:0}
.terrain-bar{display:flex;height:14px;border-radius:3px;overflow:hidden;margin-bottom:6px}
.tb-p,.tb-h,.tb-m{display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff}
.tb-p{background:var(--green)}.tb-h{background:var(--gold)}.tb-m{background:var(--accent2)}
.topo-chart{margin:8px 0;padding:8px;background:rgba(0,0,0,.15);border-radius:4px;border:1px solid var(--border)}
.trade-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:4px 8px;background:rgba(255,255,255,.01);border-radius:3px}
.trade-name{flex:1;font-size:10px;color:var(--text)}.trade-pct{font-size:11px;font-weight:500;color:var(--white);min-width:40px;text-align:right}
.trade-bar{width:60px;height:4px;background:rgba(255,255,255,.03);border-radius:2px;overflow:hidden}
.trade-fill{height:100%;border-radius:2px}.trade-fill.ex{background:var(--green)}.trade-fill.im{background:var(--rose)}
.marker-item{padding:6px 8px;border-radius:4px;background:rgba(255,255,255,.015);border:1px solid var(--border);margin-bottom:4px;cursor:pointer;transition:border-color .2s}
.marker-item:hover{border-color:var(--border-h)}
.mi-name{font-size:11px;color:var(--white)}.mi-info{font-size:9px;color:var(--text-dim);margin-top:1px}
.mi-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
.mi-dot.ext{background:var(--gold)}.mi-dot.mil{background:var(--red)}.mi-dot.for{background:var(--rose)}
/* Edit controls */
.edit-btn{background:none;border:1px solid var(--border);border-radius:3px;color:var(--accent);font-size:9px;padding:2px 8px;cursor:pointer;font-family:var(--mono);letter-spacing:1px;transition:all .2s}
.edit-btn:hover{background:rgba(138,173,132,.1);border-color:var(--accent)}
.user-note{margin-top:8px;padding:10px;background:rgba(138,173,132,.04);border:1px solid rgba(138,173,132,.15);border-radius:4px;position:relative}
.user-note-label{font-size:8px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.user-note p{font-size:11px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.note-editor{width:100%;min-height:80px;padding:8px;background:rgba(0,0,0,.2);border:1px solid var(--accent);border-radius:4px;color:var(--white);font-family:var(--mono);font-size:11px;resize:vertical;outline:none;margin-top:6px}
.note-save{margin-top:6px;padding:5px 12px;background:rgba(138,173,132,.15);border:1px solid var(--accent);border-radius:3px;color:var(--accent);font-family:var(--mono);font-size:10px;cursor:pointer;letter-spacing:1px}
.note-save:hover{background:rgba(138,173,132,.25)}
.name-input{font-family:var(--sans);font-size:18px;font-weight:600;color:var(--bright);background:rgba(0,0,0,.2);border:1px solid var(--accent);border-radius:4px;padding:4px 8px;outline:none;width:200px}
/* Sidebar */
#sidebar{position:fixed;top:44px;right:10px;bottom:34px;width:280px;z-index:100;display:flex;flex-direction:column;gap:6px;transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .3s}
#sidebar.off{transform:translateX(300px);opacity:0;pointer-events:none}
.toggle-btn{position:fixed;z-index:101;width:32px;height:32px;border-radius:4px;background:var(--surface);border:1px solid var(--border);color:var(--accent);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
#btn-side{top:44px;right:10px}
#btn-detail{top:44px;left:10px;opacity:0;pointer-events:none;transition:opacity .3s}#btn-detail.on{opacity:1;pointer-events:auto}
.tabs{display:flex;border-bottom:1px solid var(--border)}.tab{flex:1;padding:8px 4px;text-align:center;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.terrain-legend{display:flex;gap:12px;font-size:9px;color:var(--text-dim)}
.terrain-legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.tl-p::before{background:var(--green)}.tl-h::before{background:var(--gold)}.tl-m::before{background:var(--accent2)}
#loader{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}#loader.done{opacity:0;pointer-events:none}
.load-bar{width:200px;height:2px;background:rgba(255,255,255,.05);border-radius:1px;overflow:hidden;margin-top:16px}.load-fill{height:100%;background:var(--accent);width:0%;transition:width .3s}
.load-msg{font-size:11px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase}
.btn-add{width:100%;padding:7px;background:rgba(138,173,132,.08);border:1px solid rgba(138,173,132,.2);border-radius:3px;color:var(--accent);font-family:var(--mono);font-size:10px;cursor:pointer;letter-spacing:1px;text-transform:uppercase}
#ev-form input,#ev-form select,#ev-form textarea{width:100%;padding:7px 9px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:3px;color:var(--white);font-family:var(--mono);font-size:10px;margin-bottom:5px;outline:none}
#ev-form textarea{resize:none;height:40px}
.ev-item{padding:8px 10px;border-radius:4px;background:rgba(255,255,255,.015);border:1px solid transparent;margin-bottom:5px;cursor:pointer}.ev-item:hover{border-color:var(--border)}
.ev-badge{font-size:8px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:2px 5px;border-radius:2px;display:inline-block;margin-bottom:3px}
.ev-badge.conflict{background:rgba(194,112,102,.12);color:var(--red)}.ev-badge.diplomacy{background:rgba(138,173,132,.12);color:var(--accent)}.ev-badge.economic{background:rgba(184,154,74,.12);color:var(--gold)}.ev-badge.alert{background:rgba(107,158,111,.12);color:var(--green)}
.cpick{display:flex;align-items:center;gap:8px;padding:6px 0}.cpick label{font-size:10px;color:var(--text-dim);flex:1}
.cpick input[type=color]{width:26px;height:26px;border:1px solid var(--border);border-radius:3px;background:none;cursor:pointer;-webkit-appearance:none}
.cpick input[type=color]::-webkit-color-swatch-wrapper{padding:2px}.cpick input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
</style>
</head>
<body>

<div class="pnl" style="flex:0 0 auto"><div class="pnl-h"><div class="pnl-t">◉ Color</div></div><div class="pnl-b" id="cpanel"><div style="font-size:10px;color:var(--text-dim)">Select a country</div></div></div>
</div>

<script>
// ============ USER NOTES SYSTEM (localStorage) ============
function getUserNotes(id,tab){try{const d=JSON.parse(localStorage.getItem('geoint_notes_'+id)||'{}');return d[tab]||''}catch(e){return''}}
function setUserNotes(id,tab,text){try{const d=JSON.parse(localStorage.getItem('geoint_notes_'+id)||'{}');d[tab]=text;localStorage.setItem('geoint_notes_'+id,JSON.stringify(d))}catch(e){}}
function getCustomName(id){try{return localStorage.getItem('geoint_name_'+id)||''}catch(e){return''}}
function setCustomName(id,name){try{localStorage.setItem('geoint_name_'+id,name)}catch(e){}}
function countryName(id){const cn=getCustomName(id);if(cn)return cn;const d=COUNTRY_DB[id];return d?d.name:(CN_NAMES[id]||'Territory '+id)}

// Country names fallback for countries not in COUNTRY_DB
const CN_NAMES={4:"Afghanistan",8:"Albania",12:"Algeria",24:"Angola",32:"Argentina",36:"Australia",40:"Austria",44:"Bahamas",50:"Bangladesh",56:"Belgium",64:"Bhutan",68:"Bolivia",70:"Bosnia & Herz.",72:"Botswana",76:"Brazil",100:"Bulgaria",104:"Myanmar",108:"Burundi",112:"Belarus",116:"Cambodia",120:"Cameroon",124:"Canada",140:"C.A.R.",144:"Sri Lanka",148:"Chad",152:"Chile",156:"China",170:"Colombia",178:"Congo",180:"DR Congo",188:"Costa Rica",191:"Croatia",192:"Cuba",196:"Cyprus",203:"Czechia",204:"Benin",208:"Denmark",214:"Dominican Rep.",218:"Ecuador",222:"El Salvador",226:"Eq.Guinea",231:"Ethiopia",232:"Eritrea",233:"Estonia",818:"Egypt",242:"Fiji",246:"Finland",250:"France",266:"Gabon",268:"Georgia",270:"Gambia",276:"Germany",288:"Ghana",300:"Greece",320:"Guatemala",324:"Guinea",328:"Guyana",332:"Haiti",340:"Honduras",348:"Hungary",352:"Iceland",356:"India",360:"Indonesia",364:"Iran",368:"Iraq",372:"Ireland",376:"Israel",380:"Italy",384:"Côte d'Ivoire",388:"Jamaica",392:"Japan",398:"Kazakhstan",400:"Jordan",404:"Kenya",408:"N.Korea",410:"S.Korea",414:"Kuwait",417:"Kyrgyzstan",418:"Laos",422:"Lebanon",426:"Lesotho",428:"Latvia",430:"Liberia",434:"Libya",440:"Lithuania",442:"Luxembourg",450:"Madagascar",454:"Malawi",458:"Malaysia",466:"Mali",478:"Mauritania",484:"Mexico",496:"Mongolia",498:"Moldova",504:"Morocco",508:"Mozambique",512:"Oman",516:"Namibia",524:"Nepal",528:"Netherlands",540:"New Caledonia",554:"New Zealand",558:"Nicaragua",562:"Niger",566:"Nigeria",578:"Norway",586:"Pakistan",591:"Panama",598:"Papua N.G.",600:"Paraguay",604:"Peru",608:"Philippines",616:"Poland",620:"Portugal",630:"Puerto Rico",634:"Qatar",642:"Romania",643:"Russia",646:"Rwanda",682:"Saudi Arabia",686:"Senegal",688:"Serbia",694:"Sierra Leone",702:"Singapore",703:"Slovakia",704:"Vietnam",705:"Slovenia",706:"Somalia",710:"South Africa",716:"Zimbabwe",724:"Spain",728:"S.Sudan",729:"Sudan",740:"Suriname",748:"eSwatini",752:"Sweden",756:"Switzerland",760:"Syria",762:"Tajikistan",764:"Thailand",768:"Togo",780:"Trinidad",784:"UAE",788:"Tunisia",792:"Turkey",795:"Turkmenistan",800:"Uganda",804:"Ukraine",826:"United Kingdom",834:"Tanzania",840:"United States",858:"Uruguay",860:"Uzbekistan",862:"Venezuela",887:"Yemen",894:"Zambia"};

// ============ CANVAS TEXTURE + GPU PICKING ENGINE ============
const W=8192,H=4096,R=1.6;
const texCv=document.createElement('canvas');texCv.width=W;texCv.height=H;const ctx=texCv.getContext('2d');
const pickCv=document.createElement('canvas');pickCv.width=W;pickCv.height=H;const pCtx=pickCv.getContext('2d');
const id2color={},color2id={};let colorIdx=256;
function assignPickColor(id){const sid=String(id),hex='#'+(colorIdx++).toString(16).padStart(6,'0');id2color[sid]=hex;color2id[hex]=sid}
function ll2px(lng,lat){return[(lng+180)/360*W,(90-lat)/180*H]}
function drawPoly(c,ring,fill,stroke,lw){c.beginPath();let px=null;ring.forEach((co,i)=>{const[x,y]=ll2px(co[0],co[1]);if(i===0)c.moveTo(x,y);else if(px!==null&&Math.abs(x-px)>W/2)c.moveTo(x,y);else c.lineTo(x,y);px=x});c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||.5;c.stroke()}}
const TJ={feature(tp,o){const s=tp.transform.scale,t=tp.transform.translate;const aa=tp.arcs.map(a=>{let x=0,y=0;return a.map(p=>{x+=p[0];y+=p[1];return[x*s[0]+t[0],y*s[1]+t[1]]})});const rv=i=>i<0?aa[~i].slice().reverse():aa[i].slice();const rn=ids=>{let c=[];ids.forEach(i=>{const a=rv(i);if(c.length)a.shift();c=c.concat(a)});return c};const gm=g=>{if(!g)return null;switch(g.type){case'Polygon':return{t:'P',c:g.arcs.map(rn)};case'MultiPolygon':return{t:'M',c:g.arcs.map(a=>a.map(rn))};default:return null}};return o.geometries.map(g=>({id:String(g.id),geo:gm(g)}))}};

(async()=>{
const lf=document.getElementById('lf');lf.style.width='15%';
const resp=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-10m.json');
const topo=await resp.json();lf.style.width='40%';
const features=TJ.feature(topo,topo.objects.countries);lf.style.width='60%';
ctx.fillStyle='#101c18';ctx.fillRect(0,0,W,H);
pCtx.fillStyle='#000000';pCtx.fillRect(0,0,W,H);
const countryPolys={};
const countryColors={};
features.forEach(f=>{const id=f.id;assignPickColor(id);if(!f.geo)return;const polys=f.geo.t==='P'?[f.geo.c]:f.geo.t==='M'?f.geo.c:[];countryPolys[id]=polys;polys.forEach(poly=>poly.forEach((ring,ri)=>{if(ri===0){drawPoly(ctx,ring,'#1e2e28','#3a5a4a',1);drawPoly(pCtx,ring,id2color[id],null)}}))});
ctx.strokeStyle='rgba(50,80,65,.12)';ctx.lineWidth=1.5;
[0,30,60,-30,-60].forEach(lat=>{ctx.beginPath();const y=(90-lat)/180*H;ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()});
for(let lng=-150;lng<=180;lng+=30){ctx.beginPath();const x=(lng+180)/360*W;ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
lf.style.width='80%';

// THREE.JS
const canvas=document.getElementById('gl');
const ren=new THREE.WebGLRenderer({canvas,antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.setClearColor(0x131a17);ren.autoClear=false;
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);cam.position.set(0,0,4.8);
scene.add(new THREE.AmbientLight(0x4a5a4e,.8));const dl=new THREE.DirectionalLight(0x8a9d8a,.7);dl.position.set(5,3,5);scene.add(dl);
const sG=new THREE.BufferGeometry(),sP=[];for(let i=0;i<3000;i++){const r=25+Math.random()*75,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);sP.push(r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph))}sG.setAttribute('position',new THREE.Float32BufferAttribute(sP,3));scene.add(new THREE.Points(sG,new THREE.PointsMaterial({color:0x556655,size:.12,sizeAttenuation:true})));
const globeGeo=new THREE.SphereGeometry(R,128,96);
const visTex=new THREE.CanvasTexture(texCv);visTex.minFilter=THREE.LinearFilter;
const visMat=new THREE.MeshPhongMaterial({map:visTex,shininess:8,specular:0x080808});
const globe=new THREE.Mesh(globeGeo,visMat);
const ocean=new THREE.Mesh(new THREE.SphereGeometry(R*.998,64,64),new THREE.MeshPhongMaterial({color:0x101c18,shininess:20}));
const globeGroup=new THREE.Group();globeGroup.add(ocean);globeGroup.add(globe);scene.add(globeGroup);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(R*1.03,64,64),new THREE.ShaderMaterial({vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 vN;void main(){float i=pow(.6-dot(vN,vec3(0,0,1.)),3.);gl_FragColor=vec4(.25,.45,.3,i*.2);}',transparent:true,side:THREE.BackSide,depthWrite:false})));
const overlayGrp=new THREE.Group();globeGroup.add(overlayGrp);
const markerGrp=new THREE.Group();globeGroup.add(markerGrp);

// GPU PICKING
const pickTex=new THREE.CanvasTexture(pickCv);pickTex.minFilter=THREE.LinearFilter;
const pickMat=new THREE.MeshBasicMaterial({map:pickTex});
const pickRT=new THREE.WebGLRenderTarget(innerWidth,innerHeight);
const pickScene=new THREE.Scene();const pickGroup=new THREE.Group();
const pickGlobe=new THREE.Mesh(globeGeo,pickMat);pickGroup.add(pickGlobe);pickScene.add(pickGroup);
const pickBuf=new Uint8Array(4);
function gpuPick(mx,my){ren.readRenderTargetPixels(pickRT,Math.floor(mx*pickRT.width/innerWidth),pickRT.height-1-Math.floor(my*pickRT.height/innerHeight),1,1,pickBuf);if(pickBuf[0]===0&&pickBuf[1]===0&&pickBuf[2]===0)return null;const hex='#'+((pickBuf[0]<<16)|(pickBuf[1]<<8)|pickBuf[2]).toString(16).padStart(6,'0');return color2id[hex]||null}

// INTERACTION
let drag=false,pm={x:0,y:0},cpm={x:0,y:0},rvx=0,rvy=0,autoR=true,tZoom=4.8;
let selectedId=null,hoveredId=null,activeTab='overview',events=[];
function llv(lat,lng,r){const p=(90-lat)*Math.PI/180,t=(lng+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))}
function fN(n){if(!n)return'0';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return''+n}
function redrawCountry(id,fill){if(!countryPolys[id])return;countryPolys[id].forEach(poly=>poly.forEach((ring,ri)=>{if(ri===0)drawPoly(ctx,ring,fill,'#3a5a4a',1)}));visTex.needsUpdate=true}
function clearOv(){while(overlayGrp.children.length)overlayGrp.remove(overlayGrp.children[0])}
function addOv(lat,lng,col){const p=llv(lat,lng,R*1.02),g=new THREE.Group();g.add(new THREE.Mesh(new THREE.SphereGeometry(.012,8,8),new THREE.MeshBasicMaterial({color:col})));g.position.copy(p);g.lookAt(0,0,0);g.rotateX(Math.PI);overlayGrp.add(g)}

canvas.addEventListener('mousedown',e=>{drag=true;pm=cpm={x:e.clientX,y:e.clientY};autoR=false});
canvas.addEventListener('mousemove',e=>{if(drag){const dx=e.clientX-pm.x,dy=e.clientY-pm.y;rvx=dx*.003;rvy=dy*.003;globeGroup.rotation.y+=dx*.005;globeGroup.rotation.x=Math.max(-Math.PI/2,Math.min(Math.PI/2,globeGroup.rotation.x+dy*.005));pm={x:e.clientX,y:e.clientY};return}
const id=gpuPick(e.clientX,e.clientY);const tt=document.getElementById('tip');const nm=id?countryName(id):null;
document.getElementById('coords').textContent=nm||'—';
if(id&&nm){const d=COUNTRY_DB[id];tt.classList.add('on');tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-8)+'px';document.getElementById('tt-n').textContent=(d&&d.flag?d.flag+' ':'')+nm;document.getElementById('tt-s').textContent=d?`POP ${fN(d.population)} · GDP $${d.gdp}B`:'';canvas.style.cursor='pointer';if(hoveredId!==id){if(hoveredId&&hoveredId!==selectedId)redrawCountry(hoveredId,countryColors[hoveredId]||'#1e2e28');hoveredId=id;if(hoveredId!==selectedId)redrawCountry(hoveredId,'#2a4a3a')}}else{tt.classList.remove('on');canvas.style.cursor='grab';if(hoveredId&&hoveredId!==selectedId){redrawCountry(hoveredId,countryColors[hoveredId]||'#1e2e28');hoveredId=null}}});
canvas.addEventListener('mouseup',()=>drag=false);
canvas.addEventListener('wheel',e=>{tZoom=Math.max(2,Math.min(10,tZoom+e.deltaY*.005));e.preventDefault()},{passive:false});
canvas.addEventListener('click',e=>{if(Math.abs(e.clientX-cpm.x)>5||Math.abs(e.clientY-cpm.y)>5)return;selectCountry(gpuPick(e.clientX,e.clientY))});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function selectCountry(id){clearOv();if(selectedId)redrawCountry(selectedId,'#1e2e28');selectedId=id;if(!selectedId){closeDetail();return}redrawCountry(selectedId,'#305852');showDetail(selectedId);const d=COUNTRY_DB[id];if(d&&d.extraction)d.extraction.forEach(e=>addOv(e.lat,e.lng,0xb89a4a));if(d&&d.bases)d.bases.forEach(b=>addOv(b.lat,b.lng,b.f?0xc4a095:0xc27066))}

window.focusLL=function(lat,lng){const ty=-lng*Math.PI/180,tx=lat*Math.PI/180,sx=globeGroup.rotation.x,sy=globeGroup.rotation.y;let t=0;autoR=false;(function step(){t+=1/60;if(t>1.2)return;const p=1-Math.pow(1-t/1.2,3);globeGroup.rotation.x=sx+(tx-sx)*p;globeGroup.rotation.y=sy+(ty-sy)*p;requestAnimationFrame(step)})()};

// ============ DETAIL PANEL WITH EDITING ============
function showDetail(id){document.getElementById('detail').classList.add('open');document.getElementById('btn-detail').classList.add('on');activeTab='overview';setTabs();renderTab(id)}
window.closeDetail=function(){document.getElementById('detail').classList.remove('open');document.getElementById('btn-detail').classList.remove('on');clearOv();if(selectedId){redrawCountry(selectedId,countryColors[selectedId]||'#1e2e28');selectedId=null}}
document.querySelectorAll('#dtabs .tab').forEach(t=>t.addEventListener('click',()=>{activeTab=t.dataset.tab;setTabs();if(selectedId)renderTab(selectedId)}));
function setTabs(){document.querySelectorAll('#dtabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===activeTab))}

// Edit note helper
function noteHTML(id,tab,label){
  const existing=getUserNotes(id,tab);
  return `<div class="user-note"><div class="user-note-label">✏ ${label||'Your Notes'}</div>${existing?`<p>${existing}</p><button class="edit-btn" onclick="editNote('${id}','${tab}')">Edit</button>`:`<button class="edit-btn" onclick="editNote('${id}','${tab}')">+ Add Note</button>`}</div>`;
}
window.editNote=function(id,tab){
  const existing=getUserNotes(id,tab);
  const container=document.querySelector('.user-note');
  if(!container)return;
  container.innerHTML=`<div class="user-note-label">✏ Editing</div><textarea class="note-editor" id="note-ed">${existing}</textarea><button class="note-save" onclick="saveNote('${id}','${tab}')">Save</button>`;
  document.getElementById('note-ed').focus();
};
window.saveNote=function(id,tab){
  const text=document.getElementById('note-ed').value;
  setUserNotes(id,tab,text);
  renderTab(id);
};
window.editName=function(id){
  const el=document.getElementById('cname');
  const current=countryName(id);
  el.outerHTML=`<input class="name-input" id="name-ed" value="${current}" onkeydown="if(event.key==='Enter')saveName('${id}')" onblur="saveName('${id}')">`;
  document.getElementById('name-ed').focus();
};
window.saveName=function(id){
  const el=document.getElementById('name-ed');
  if(el)setCustomName(id,el.value);
  renderTab(id);
};

function renderTab(id){
  const d=COUNTRY_DB[id],b=document.getElementById('det-body');
  const nm=countryName(id);
  if(!d){b.innerHTML=`<div style="padding:20px"><div class="c-name" id="cname" onclick="editName('${id}')">${nm}</div><div style="font-size:11px;color:var(--text-dim);margin-top:8px">No detailed data. Click name to rename.</div>${noteHTML(id,activeTab,'Custom Intel')}</div>`;return}
  if(activeTab==='overview')b.innerHTML=rOverview(d,id);
  else if(activeTab==='geography')b.innerHTML=rGeo(d,id);
  else if(activeTab==='economy')b.innerHTML=rEcon(d,id);
  else b.innerHTML=rStrat(d,id);
}

function rOverview(d,id){const nm=countryName(id);
let h=`<div class="c-head"><div class="c-flag">${d.flag||''}</div><div><div class="c-name" id="cname" onclick="editName('${id}')" title="Click to rename">${nm}</div><div class="c-cap">Capital: ${d.capital||'—'}</div></div></div>`;
h+=`<div class="stats"><div class="stat"><div class="sl">Population</div><div class="sv">${fN(d.population)}</div></div><div class="stat"><div class="sl">Area km²</div><div class="sv">${fN(d.area)}</div></div><div class="stat"><div class="sl">GDP (B USD)</div><div class="sv">$${d.gdp||'—'}</div></div><div class="stat"><div class="sl">GDP/Capita</div><div class="sv">$${d.gdpPC?fN(d.gdpPC):'—'}</div></div></div>`;
if(d.ethnicities){h+='<div class="sec"><div class="sec-t">Ethnic Composition</div>';d.ethnicities.forEach(e=>{h+=`<div class="eth-row"><span class="eth-name">${e.n}</span><div class="eth-track"><div class="eth-fill" style="width:${e.p}%"></div></div><span class="eth-pct">${e.p}%</span></div>`;if(d.ethProfiles&&d.ethProfiles[e.n])h+=`<div class="eth-profile"><p>${d.ethProfiles[e.n]}</p></div>`});h+='</div>'}
if(d.culture)h+=`<div class="sec"><div class="sec-t">Cultural Profile</div><p>${d.culture}</p></div>`;
h+=noteHTML(id,'overview','Overview Notes');return h}

function rGeo(d,id){let h='';
if(d.terrain){const t=d.terrain;h+=`<div class="sec"><div class="sec-t">Terrain</div><div class="terrain-bar"><div class="tb-p" style="width:${t.plains}%">${t.plains}%</div><div class="tb-h" style="width:${t.hills}%">${t.hills}%</div><div class="tb-m" style="width:${t.mountains}%">${t.mountains}%</div></div><div class="terrain-legend"><span class="tl-p">Plains</span><span class="tl-h">Hills</span><span class="tl-m">Mountains</span></div></div>`}
if(d.peaks&&d.peaks.length){const mx=Math.max(...d.peaks.map(p=>p.h)),cw=360,ch=80;h+=`<div class="sec"><div class="sec-t">Elevation Profile</div><div class="topo-chart"><svg width="${cw}" height="${ch+35}" viewBox="0 0 ${cw} ${ch+35}">`;const gap=cw/(d.peaks.length+1);d.peaks.forEach((p,i)=>{const x=gap*(i+1),bh=Math.max(10,(p.h/mx)*ch);h+=`<rect x="${x-14}" y="${ch-bh+8}" width="28" height="${bh}" fill="#6b4a2a" rx="2"/><text x="${x}" y="${ch-bh}" text-anchor="middle" fill="#d5c4a1" font-size="10" font-family="IBM Plex Mono" font-weight="600">${p.h}m</text><text x="${x}" y="${ch+22}" text-anchor="middle" fill="#9aaa97" font-size="7" font-family="IBM Plex Mono">${p.n}</text>`});h+='</svg></div></div>'}
if(d.mountains)h+=`<div class="sec"><div class="sec-t">Mountains</div><ul>${d.mountains.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
if(d.plains)h+=`<div class="sec"><div class="sec-t">Plains</div><ul>${d.plains.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
if(d.rivers)h+=`<div class="sec"><div class="sec-t">Rivers</div><ul>${d.rivers.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
if(d.lakes)h+=`<div class="sec"><div class="sec-t">Lakes</div><ul>${d.lakes.map(m=>'<li>'+m+'</li>').join('')}</ul></div>`;
h+=noteHTML(id,'geography','Geography Notes');return h||noteHTML(id,'geography','Geography Notes')}

function rEcon(d,id){let h=`<div class="stats"><div class="stat"><div class="sl">GDP (B)</div><div class="sv">$${d.gdp||'—'}</div></div><div class="stat"><div class="sl">GDP/Cap</div><div class="sv">$${d.gdpPC?fN(d.gdpPC):'—'}</div></div></div>`;
if(d.exports&&d.exports.length){h+='<div class="sec"><div class="sec-t">Top Exports</div>';d.exports.forEach(e=>{const o=typeof e==='string'?{n:e}:e;h+=`<div class="trade-row"><span class="trade-name">${o.n}</span>${o.p?`<div class="trade-bar"><div class="trade-fill ex" style="width:${Math.min(o.p*1.5,100)}%"></div></div><span class="trade-pct">${o.p}%</span>`:''}</div>`});h+='</div>'}
if(d.imports&&d.imports.length){h+='<div class="sec"><div class="sec-t">Top Imports</div>';d.imports.forEach(e=>{const o=typeof e==='string'?{n:e}:e;h+=`<div class="trade-row"><span class="trade-name">${o.n}</span>${o.p?`<div class="trade-bar"><div class="trade-fill im" style="width:${Math.min(o.p*1.5,100)}%"></div></div><span class="trade-pct">${o.p}%</span>`:''}</div>`});h+='</div>'}
if(d.extraction&&d.extraction.length){h+='<div class="sec"><div class="sec-t">Extraction Sites</div>';d.extraction.forEach(e=>{h+=`<div class="marker-item" onclick="focusLL(${e.lat},${e.lng})"><div class="mi-name"><span class="mi-dot ext"></span>${e.n}</div><div class="mi-info">${e.r}</div></div>`});h+='</div>'}
h+=noteHTML(id,'economy','Economic Notes');return h}

function rStrat(d,id){let h='';
if(d.bases&&d.bases.length){const dom=d.bases.filter(b=>!b.f),fore=d.bases.filter(b=>b.f);
if(dom.length){h+='<div class="sec"><div class="sec-t">Domestic</div>';dom.forEach(b=>{h+=`<div class="marker-item" onclick="focusLL(${b.lat},${b.lng})"><div class="mi-name"><span class="mi-dot mil"></span>${b.n}</div><div class="mi-info">${b.t}</div></div>`});h+='</div>'}
if(fore.length){h+='<div class="sec"><div class="sec-t">Foreign Presence</div>';fore.forEach(b=>{h+=`<div class="marker-item" onclick="focusLL(${b.lat},${b.lng})"><div class="mi-name"><span class="mi-dot for"></span>${b.n}</div><div class="mi-info">${b.t}</div></div>`});h+='</div>'}}
h+=noteHTML(id,'strategic','Strategic Notes');return h||noteHTML(id,'strategic','Strategic Notes')}

// Sidebar
document.getElementById('btn-side').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('off'));
document.getElementById('btn-detail').addEventListener('click',()=>closeDetail());
// Color panel
function showCP(id){const d=COUNTRY_DB[id];const cur=countryColors[id]||'#1e2e28';document.getElementById('cpanel').innerHTML=`<div style="font-size:12px;color:var(--white);margin-bottom:6px">${d?(d.flag||'')+' '+countryName(id):countryName(id)}</div><div class="cpick"><label>Color</label><input type="color" value="${cur}" onchange="countryColors['${id}']=this.value;redrawCountry('${id}',this.value)"></div><button class="edit-btn" onclick="delete countryColors['${id}'];redrawCountry('${id}','#1e2e28');showCP('${id}')">Reset</button>`}
// Events
document.getElementById('btn-ev').addEventListener('click',()=>{const ti=document.getElementById('ev-t').value.trim();if(!ti)return;events.push({title:ti,type:document.getElementById('ev-type').value});document.getElementById('ev-count').textContent=events.length;document.getElementById('ev-list').innerHTML=events.map((e,i)=>`<div class="ev-item"><span class="ev-badge ${e.type}">${e.type}</span> ${e.title}</div>`).join('');document.getElementById('ev-t').value=''});
// Clock
setInterval(()=>{const n=new Date;document.getElementById('clock').textContent=`UTC ${n.getUTCHours().toString().padStart(2,'0')}:${n.getUTCMinutes().toString().padStart(2,'0')}:${n.getUTCSeconds().toString().padStart(2,'0')}`},1000);

// ANIMATION
lf.style.width='100%';setTimeout(()=>document.getElementById('loader').classList.add('done'),600);
function animate(){requestAnimationFrame(animate);if(autoR)globeGroup.rotation.y+=.0005;if(!drag){rvx*=.94;rvy*=.94;globeGroup.rotation.y+=rvx;globeGroup.rotation.x+=rvy}cam.position.z+=(tZoom-cam.position.z)*.06;pickGroup.rotation.copy(globeGroup.rotation);ren.setRenderTarget(pickRT);ren.setClearColor(0x000000,1);ren.clear();ren.render(pickScene,cam);ren.setRenderTarget(null);ren.setClearColor(0x131a17,1);ren.clear();ren.render(scene,cam);const t=Date.now()*.003;overlayGrp.children.forEach(g=>{const s=1+Math.sin(t)*.3;g.scale.set(s,s,s)})}
animate();
window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);pickRT.setSize(innerWidth,innerHeight)});
// Show color panel on select
const origSelect=selectCountry;
selectCountry=function(id){clearOv();if(selectedId)redrawCountry(selectedId,countryColors[selectedId]||'#1e2e28');selectedId=id;if(!selectedId){closeDetail();document.getElementById('cpanel').innerHTML='<div style="font-size:10px;color:var(--text-dim)">Select a country</div>';return}redrawCountry(selectedId,'#305852');showDetail(selectedId);showCP(selectedId);const d=COUNTRY_DB[id];if(d&&d.extraction)d.extraction.forEach(e=>addOv(e.lat,e.lng,0xb89a4a));if(d&&d.bases)d.bases.forEach(b=>addOv(b.lat,b.lng,b.f?0xc4a095:0xc27066))};
})();
</script>
</body></html>
