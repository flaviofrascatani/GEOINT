name: Generate static topo maps

# Pre-renders public/topo/<id>.svg for every country with real Open-Meteo
# DEM data (same algorithm/style as the runtime topo.js generator).
# Run it once manually after pushing (Actions tab -> "Generate static topo
# maps" -> Run workflow); the monthly schedule keeps them fresh.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate ALL maps (instead of only missing ones)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 3 1 * *'   # monthly, 1st day 03:00 UTC

permissions:
  contents: write

concurrency:
  group: topo-maps
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate topo maps
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python tools/generate_topo.py --force
          else
            python tools/generate_topo.py
          fi

      - name: Commit maps
        run: |
          git config user.name  "geoint-topo[bot]"
          git config user.email "geoint-topo@users.noreply.github.com"
          git add public/topo
          if git diff --cached --quiet; then
            echo "No new maps."
            exit 0
          fi
          git commit -m "chore(topo): pre-generated static topo maps [skip ci]"
          git push
